<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扑克的书房 · The Study</title>
<style>
  /* ============ 基础 ============ */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#d9b45b;
    --gold-hi:#f6e4a8;
    --gold-dim:#8d7132;
    --oak:#3a2418;
    --oak-hi:#5b3a26;
    --oak-lo:#1d1109;
    --ink:#0c0906;
    --parch:#e8dcc0;
    --candle:#ffb457;
  }
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--parch);
    font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ============ 房间 ============ */
  .room{
    position:fixed;inset:0;
    perspective:1600px;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(120,86,40,.30) 0%, rgba(30,20,12,.55) 42%, rgba(8,6,4,.94) 78%),
      linear-gradient(#150e08, #0b0805 60%, #070504);
    overflow:hidden;
  }
  /* 墙面石纹 */
  .room::before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 2px, transparent 2px 140px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 96px);
    mix-blend-mode:overlay;pointer-events:none;
  }
  /* 地面 */
  .floor{
    position:absolute;left:0;right:0;bottom:0;height:26vh;
    background:
      linear-gradient(#0a0705 0%, #140d07 40%, #1b1209 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 1px, transparent 1px 90px);
    box-shadow:inset 0 30px 60px rgba(0,0,0,.9);
  }
  .floor::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 120% at 50% -10%, rgba(255,178,90,.14), transparent 70%);
  }

  /* ============ 哥特拱窗 + 月光 ============ */
  .window{
    position:absolute;top:4vh;left:50%;transform:translateX(-50%);
    width:min(300px,26vw);height:min(430px,44vh);
    border-radius:50% 50% 6px 6px / 34% 34% 4px 4px;
    background:linear-gradient(180deg, rgba(150,190,225,.20), rgba(70,105,150,.10) 55%, rgba(30,45,70,.05));
    box-shadow:0 0 90px 30px rgba(140,180,225,.09), inset 0 0 40px rgba(180,210,240,.10);
    opacity:.85;
  }
  .window::before{ /* 窗棂 */
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:
      repeating-linear-gradient(90deg, rgba(20,14,9,.85) 0 4px, transparent 4px 34%),
      repeating-linear-gradient(0deg, rgba(20,14,9,.85) 0 4px, transparent 4px 22%);
    mix-blend-mode:multiply;
  }
  .window::after{ /* 石框 */
    content:"";position:absolute;inset:-12px;border-radius:inherit;
    border:12px solid #241811;filter:brightness(.9);
  }
  .moonbeam{
    position:absolute;top:6vh;left:50%;
    width:min(360px,32vw);height:70vh;
    transform:translateX(-50%) rotate(6deg);transform-origin:top center;
    background:linear-gradient(rgba(175,205,235,.13), rgba(175,205,235,.03) 55%, transparent 85%);
    filter:blur(10px);pointer-events:none;
  }

  /* ============ 漂浮蜡烛 ============ */
  .candle{position:absolute;pointer-events:none;animation:bob 7s ease-in-out infinite}
  .candle .wax{
    width:9px;border-radius:3px;
    background:linear-gradient(#f3e6cd,#cbb894 60%,#9c8768);
    box-shadow:0 0 14px rgba(255,190,110,.5);
    margin:0 auto;
  }
  .candle .flame{
    width:9px;height:16px;margin:0 auto -3px;border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 50% 72%, #fff6d8 0 18%, var(--candle) 45%, rgba(255,120,30,.75) 72%, transparent 78%);
    filter:blur(.4px);
    animation:flicker 1.5s ease-in-out infinite;
  }
  .candle .halo{
    position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,176,88,.20), transparent 68%);
    animation:pulse 3.4s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1);opacity:.95}
    30%{transform:scaleY(1.14) scaleX(.92);opacity:1}
    55%{transform:scaleY(.93) scaleX(1.06);opacity:.88}
    75%{transform:scaleY(1.07) scaleX(.97);opacity:.97}
  }
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ============ 尘埃 ============ */
  .mote{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(255,224,170,.9),rgba(255,200,130,0) 70%);
    pointer-events:none;animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate(0,0);opacity:0}
    12%{opacity:.85}
    88%{opacity:.5}
    100%{transform:translate(var(--dx),var(--dy));opacity:0}
  }

  /* ============ 标题 ============ */
  .masthead{
    position:relative;z-index:5;text-align:center;padding:22px 0 6px;
  }
  .masthead h1{
    font-size:clamp(20px,2.5vw,32px);font-weight:400;letter-spacing:.34em;
    background:linear-gradient(#fff2cd,var(--gold) 45%,#a37f30);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(217,180,91,.28);
  }
  .masthead .sub{
    margin-top:7px;font-size:11px;letter-spacing:.42em;color:#a08a5e;text-transform:uppercase;
  }
  .crest{display:block;margin:0 auto 6px}

  /* ============ 分类铜牌 ============ */
  .plaques{
    position:relative;z-index:5;display:flex;gap:10px;justify-content:center;
    margin:12px 0 8px;flex-wrap:wrap;padding:0 12px;
  }
  .plaque{
    font-family:inherit;font-size:12px;letter-spacing:.16em;cursor:pointer;
    padding:7px 17px;border-radius:3px;color:#e3cd93;
    background:linear-gradient(#4a3720,#2c2013);
    border:1px solid #6a5228;
    box-shadow:0 1px 0 rgba(255,224,160,.18) inset,0 3px 8px rgba(0,0,0,.6);
    transition:.25s;
  }
  .plaque:hover{color:#fff3d2;border-color:var(--gold);box-shadow:0 0 14px rgba(217,180,91,.35)}
  .plaque.on{
    background:linear-gradient(#7a5c26,#4a3617);color:#fff6dc;border-color:var(--gold-hi);
    box-shadow:0 0 18px rgba(217,180,91,.45)
  }

  /* ============ 书架 ============ */
  .bookcase{
    position:relative;z-index:4;
    width:fit-content;min-width:min(690px,92vw);max-width:94vw;
    margin:6px auto 10vh;
    padding:14px 26px 8px;
    background:
      linear-gradient(#2a1a10,#1a1008 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 3px, transparent 3px 26px);
    border:2px solid #150c06;
    border-radius:8px 8px 4px 4px;
    box-shadow:
      0 -2px 0 rgba(255,200,130,.10) inset,
      0 40px 90px rgba(0,0,0,.85),
      0 0 0 8px rgba(15,9,5,.55);
  }
  .bookcase::before{ /* 顶部檐口 */
    content:"";position:absolute;left:-14px;right:-14px;top:-16px;height:16px;
    background:linear-gradient(#5c3d26,#2a1a10);
    border-radius:4px 4px 0 0;
    box-shadow:0 -1px 0 rgba(255,214,150,.20) inset,0 6px 14px rgba(0,0,0,.7);
  }
  .shelf{position:relative;margin-bottom:13px}
  /* 该层书多到需要横滑时，右缘给出渐隐与提示 */
  .shelf.scrollx::after{
    content:"";position:absolute;right:0;top:0;bottom:13px;width:46px;
    pointer-events:none;
    background:linear-gradient(90deg,rgba(10,7,4,0),rgba(10,7,4,.78));
  }
  .shelf.scrollx::before{
    content:"滑 \203A";position:absolute;right:7px;bottom:20px;z-index:2;
    font-size:10px;letter-spacing:.12em;color:#a2884f;pointer-events:none;opacity:.85;
  }
  .books{
    display:flex;align-items:flex-end;
    min-height:184px;padding:0 10px;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;
    /* 架内暗部 + 一点烛光回照 */
    background:
      radial-gradient(120% 90% at 50% 108%, rgba(214,158,74,.10), transparent 62%),
      linear-gradient(180deg, rgba(0,0,0,.48), rgba(0,0,0,.08) 42%, transparent);
  }
  .books::-webkit-scrollbar{height:0}
  .books-inner{display:flex;align-items:flex-end;gap:5px;margin:0 auto}
  .board{ /* 隔板 */
    height:13px;border-radius:2px;
    background:linear-gradient(#6b4728 0%, #432c19 42%, #22150c 100%);
    box-shadow:
      0 -1px 0 rgba(255,215,150,.22) inset,
      0 5px 12px rgba(0,0,0,.8);
    position:relative;
  }
  .board::after{ /* 铜条 */
    content:"";position:absolute;left:4%;right:4%;top:-2px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(217,180,91,.55),transparent);
  }
  /* 层类目铜牌 */
  .shelf-tag{
    position:absolute;left:12px;bottom:-9px;z-index:3;
    display:flex;align-items:baseline;gap:7px;
    padding:4px 11px;border-radius:2px;
    font-size:11px;letter-spacing:.2em;color:#f4e3b4;
    background:linear-gradient(#7a5c26,#3e2c13);
    border:1px solid #8a6c30;
    box-shadow:0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,231,175,.28) inset;
    white-space:nowrap;
  }
  .shelf-tag .n{font-size:9.5px;letter-spacing:.1em;color:#d5b56d;opacity:.9}
  /* 空层占位 */
  .empty-shelf{
    display:flex;align-items:center;gap:10px;margin:0 auto;padding:0 6px;
    opacity:.55;
  }
  .ghost{
    width:44px;height:150px;border-radius:2px 4px 4px 2px;
    border:1px dashed rgba(217,180,91,.35);
    background:linear-gradient(90deg, rgba(217,180,91,.05), rgba(217,180,91,.02));
  }
  .empty-note{
    font-size:11.5px;letter-spacing:.22em;color:#8e7746;white-space:nowrap;padding:0 8px;
  }

  /* ============ 书脊 ============ */
  .spine{
    position:relative;flex:0 0 auto;cursor:pointer;
    border-radius:2px 4px 4px 2px;
    display:flex;align-items:center;justify-content:center;
    transform-origin:bottom center;
    transition:transform .42s cubic-bezier(.2,.8,.25,1), box-shadow .42s, filter .42s;
    box-shadow:
      2px 0 5px rgba(0,0,0,.6),
      inset -3px 0 6px rgba(0,0,0,.45),
      inset 3px 0 5px rgba(255,255,255,.06);
    overflow:hidden;
  }
  .spine::before{ /* 书脊上下金环 */
    content:"";position:absolute;left:2px;right:2px;top:11%;height:26%;
    border-top:1px solid rgba(217,180,91,.5);
    border-bottom:1px solid rgba(217,180,91,.5);
    opacity:.55;pointer-events:none;
  }
  .spine::after{ /* 皮革光泽 */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg, rgba(255,255,255,.10) 0 12%, transparent 30% 72%, rgba(0,0,0,.35) 100%);
  }
  .spine .label{
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:12.5px;letter-spacing:.06em;line-height:1.05;
    color:#f0dda8;white-space:nowrap;
    text-shadow:0 1px 1px rgba(0,0,0,.85), 0 0 8px rgba(217,180,91,.25);
    max-height:88%;
    padding:4px 0;
  }
  .spine:hover{
    transform:translateY(-16px) rotateZ(-3.5deg) scale(1.03);
    filter:brightness(1.22);
    box-shadow:2px 0 5px rgba(0,0,0,.6), 0 14px 30px rgba(0,0,0,.75), 0 0 26px rgba(217,180,91,.42);
    z-index:3;
  }
  .spine.dim{opacity:.16;filter:grayscale(.7) brightness(.6);pointer-events:none}
  .spine.taken{opacity:0;transition:opacity .18s}

  /* ============ 讲桌 / 前景 ============ */
  .desk{
    position:absolute;left:0;right:0;bottom:0;height:12vh;z-index:6;
    background:linear-gradient(#2b1c11,#150d07 70%,#0a0604);
    box-shadow:0 -14px 40px rgba(0,0,0,.85), 0 -1px 0 rgba(255,206,140,.14) inset;
  }
  .desk::before{
    content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,transparent,rgba(217,180,91,.35),transparent);
  }
  .hint{
    position:absolute;left:0;right:0;bottom:3.2vh;z-index:8;
    text-align:center;font-size:11.5px;letter-spacing:.24em;color:#8e7746;
    text-shadow:0 1px 6px #000;pointer-events:none;
  }

  /* ============ 书桌上的羊皮纸摘要卡 ============ */
  .memo{
    position:fixed;left:26px;bottom:22px;z-index:12;
    width:314px;max-height:46vh;
    display:flex;flex-direction:column;
    transform:rotate(-1.1deg);
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.45), transparent 60%),
      linear-gradient(158deg,#efe4c6 0%,#e3d5b2 46%,#d3c39c 100%);
    color:#4b3a1c;
    border-radius:3px;
    box-shadow:
      0 18px 40px rgba(0,0,0,.72),
      0 2px 0 rgba(255,255,255,.28) inset,
      0 0 0 1px rgba(120,94,44,.35);
    transition:transform .3s cubic-bezier(.2,.8,.25,1), opacity .3s;
  }
  .memo::after{ /* 纸纹 + 边缘做旧 */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(120,94,44,.045) 0 1px, transparent 1px 4px),
      radial-gradient(100% 100% at 50% 50%, transparent 62%, rgba(105,80,36,.22) 100%);
  }
  .memo .pin{
    position:absolute;top:-7px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ffeeb8, var(--gold) 45%, #7d6021 100%);
    box-shadow:0 2px 5px rgba(0,0,0,.6);
  }
  .memo-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:11px 12px 7px;border-bottom:1px solid rgba(120,94,44,.28);
  }
  .memo-head .mt{flex:1;min-width:0}
  .memo-head .mt b{
    display:block;font-size:13px;font-weight:400;letter-spacing:.16em;color:#5a4520;
  }
  .memo-head .mt span{
    display:block;margin-top:3px;font-size:10.5px;letter-spacing:.1em;color:#8a7440;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mnav{
    font-family:inherit;cursor:pointer;background:none;border:1px solid rgba(120,94,44,.4);
    color:#6b5528;border-radius:2px;width:22px;height:22px;line-height:1;
    font-size:12px;transition:.2s;flex:0 0 auto;
  }
  .mnav:hover:not(:disabled){background:rgba(120,94,44,.14);border-color:#8a6c30}
  .mnav:disabled{opacity:.3;cursor:default}
  .memo-body{
    flex:1;min-height:0;overflow-y:auto;padding:8px 12px 10px;
  }
  .memo-body::-webkit-scrollbar{width:5px}
  .memo-body::-webkit-scrollbar-thumb{background:rgba(120,94,44,.35);border-radius:3px}
  .mrow{display:flex;gap:9px;padding:6px 0;border-bottom:1px dotted rgba(120,94,44,.22)}
  .mrow:last-child{border-bottom:0}
  .mrow .k{
    flex:0 0 42px;font-size:11px;letter-spacing:.1em;color:#7a6231;padding-top:1px;
  }
  .mrow .v{flex:1;min-width:0;font-size:12.5px;line-height:1.55;color:#40310f}
  .mrow .v em{font-style:normal;color:#7c6531;font-size:11.5px}
  .mrow.off .v{color:#9c8a5f}
  .memo-foot{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:7px 12px 9px;border-top:1px solid rgba(120,94,44,.28);
  }
  .mlink{
    font-family:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer;
    background:none;border:0;color:#6b5528;padding:2px 0;text-decoration:underline;
    text-decoration-color:rgba(107,85,40,.4);text-underline-offset:3px;
  }
  .mlink:hover{color:#3d2f10}
  .memo-foot .sp{flex:1}
  .memo.fold{transform:rotate(-1.1deg) translateY(calc(100% - 44px))}
  .memo .memo-tab{display:none}
  .memo.fold .memo-tab{
    display:block;position:absolute;left:0;right:0;top:-1px;height:44px;
    cursor:pointer;z-index:2;
  }

  /* ============ 起居注（数据变更） ============ */
  .ledger-btn{
    position:fixed;bottom:14px;right:16px;z-index:20;
    display:flex;align-items:center;gap:7px;
    font-family:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;
    padding:7px 13px;border-radius:3px;color:#e9d5a1;
    background:linear-gradient(#4a3720,#2c2013);border:1px solid #6a5228;
    box-shadow:0 1px 0 rgba(255,224,160,.18) inset,0 3px 8px rgba(0,0,0,.6);
    transition:.2s;
  }
  .ledger-btn:hover{color:#fff6dc;border-color:var(--gold);box-shadow:0 0 14px rgba(217,180,91,.35)}
  .ledger-btn .dot{
    width:6px;height:6px;border-radius:50%;background:#10b981;
    box-shadow:0 0 7px rgba(16,185,129,.8);flex:0 0 auto;
  }
  .ledger-btn .dot.warn{background:#f59e0b;box-shadow:0 0 7px rgba(245,158,11,.8)}
  .ledger-btn .dot.off{background:#7a6a4a;box-shadow:none}
  .sfx{
    position:fixed;bottom:14px;right:150px;z-index:20;
    background:none;border:1px solid #5c4622;border-radius:3px;
    color:#a08a5e;cursor:pointer;padding:6px 9px;
    font-family:inherit;font-size:10.5px;letter-spacing:.14em;transition:.2s;
  }
  .sfx:hover{color:var(--gold-hi);border-color:var(--gold)}

  .ledger{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:22px;
  }
  .ledger.on{display:flex}
  .ledger .lveil{
    position:absolute;inset:0;
    background:radial-gradient(60% 60% at 50% 45%, rgba(60,42,20,.6), rgba(4,3,2,.94) 75%);
    backdrop-filter:blur(3px);
  }
  .lpaper{
    position:relative;width:min(760px,96vw);max-height:88vh;
    display:flex;flex-direction:column;border-radius:4px;
    background:linear-gradient(#efe6cf,#ded0b0);
    color:#41300f;
    box-shadow:0 34px 90px rgba(0,0,0,.9), 0 0 0 2px #2a1c10, 0 0 60px rgba(217,180,91,.16);
    overflow:hidden;
  }
  .lbar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 13px;
    background:linear-gradient(#3b2716,#241709);
    border-bottom:2px solid #6a5228;color:#e9d5a1;
  }
  .lbar .t{flex:1;min-width:0;font-size:13.5px;letter-spacing:.1em}
  .lbar .t small{display:block;font-size:10.5px;color:#a08a5e;letter-spacing:.06em;margin-top:2px}
  .bbtn{
    font-family:inherit;font-size:11.5px;letter-spacing:.1em;cursor:pointer;white-space:nowrap;
    padding:6px 12px;border-radius:3px;color:#f0dda8;
    background:linear-gradient(#5a4222,#33240f);border:1px solid #7a5f2b;
    transition:.2s;
  }
  .bbtn:hover{color:#fff6dc;border-color:var(--gold-hi);box-shadow:0 0 12px rgba(217,180,91,.4)}
  .lbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 18px}
  .lbody::-webkit-scrollbar{width:7px}
  .lbody::-webkit-scrollbar-thumb{background:rgba(120,94,44,.4);border-radius:4px}
  .lday{margin-bottom:16px}
  .ldate{
    display:flex;align-items:baseline;gap:9px;
    padding-bottom:5px;margin-bottom:7px;border-bottom:1px solid rgba(120,94,44,.3);
  }
  .ldate b{font-size:13.5px;font-weight:400;letter-spacing:.1em;color:#5a4520}
  .ldate span{font-size:10.5px;letter-spacing:.1em;color:#8a7440}
  .ldate i{
    font-style:normal;margin-left:auto;font-size:10.5px;letter-spacing:.08em;color:#8a7440;
  }
  .lline{display:flex;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.6}
  .lline .src{
    flex:0 0 auto;min-width:88px;font-size:11px;letter-spacing:.06em;color:#7a6231;padding-top:2px;
  }
  .lline .txt{flex:1;min-width:0;color:#3d2d0d;word-break:break-word}
  .lline .txt em{font-style:normal;color:#7c6531;font-size:11.5px}
  .chip{
    display:inline-block;margin:0 5px 3px 0;padding:1px 7px;border-radius:9px;
    font-size:10.5px;letter-spacing:.06em;
    background:rgba(120,94,44,.13);border:1px solid rgba(120,94,44,.28);color:#5f4a1d;
  }
  .lnote{
    margin-top:12px;padding-top:9px;border-top:1px dashed rgba(120,94,44,.35);
    font-size:10.5px;line-height:1.8;color:#7a6231;
  }
  .lmsg{padding:26px 6px;text-align:center;font-size:12.5px;letter-spacing:.14em;color:#7a6231}
  .lmsg .bbtn{margin-top:12px}

  /* ============ 舞台（取书 / 开书） ============ */
  .stage{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;
    perspective:2200px;
  }
  .stage.on{display:flex}
  .veil{
    position:absolute;inset:0;opacity:0;transition:opacity .7s;
    background:radial-gradient(60% 60% at 50% 45%, rgba(60,42,20,.62), rgba(4,3,2,.94) 75%);
    backdrop-filter:blur(3px);
  }
  .stage.on .veil{opacity:1}

  .book{
    position:relative;transform-style:preserve-3d;
    width:340px;height:470px;
    transition:transform .82s cubic-bezier(.22,.9,.24,1), width .82s cubic-bezier(.22,.9,.24,1), height .82s cubic-bezier(.22,.9,.24,1);
    will-change:transform,width,height;
  }
  /* 内页（书页/内容） */
  .spread{
    position:absolute;inset:0;border-radius:4px;
    background:linear-gradient(#efe6cf,#dccfb0);
    box-shadow:0 34px 90px rgba(0,0,0,.9), 0 0 0 2px #2a1c10, 0 0 60px rgba(217,180,91,.16);
    opacity:0;transition:opacity .5s .28s;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .book.open .spread{opacity:1}
  .spread .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:9px 12px;
    background:linear-gradient(#3b2716,#241709);
    border-bottom:2px solid #6a5228;
    color:#e9d5a1;
  }
  .spread .bar .t{
    flex:1;min-width:0;font-size:13.5px;letter-spacing:.1em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .spread .bar .t small{display:block;font-size:10.5px;color:#a08a5e;letter-spacing:.06em;margin-top:2px}
  .paper{position:relative;flex:1;min-height:0;background:#f4eeda}
  .paper iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .gutter{ /* 书脊中缝阴影 */
    position:absolute;left:50%;top:0;bottom:0;width:46px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(60,40,18,.20),rgba(60,40,18,.30),rgba(60,40,18,.20),transparent);
    pointer-events:none;opacity:.55;
  }
  .loading{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(#efe6cf,#e0d3b4);color:#6b5528;
    font-size:12.5px;letter-spacing:.2em;
  }
  .loading.hide{display:none}
  .loading .ring{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(140,110,50,.25);border-top-color:#9c7c34;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .fb{margin-top:4px}

  /* 封面 */
  .cover{
    position:absolute;inset:0;border-radius:3px 6px 6px 3px;
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform .95s cubic-bezier(.36,.72,.2,1), box-shadow .6s;
    box-shadow:0 30px 70px rgba(0,0,0,.85), inset 0 0 60px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:26px;text-align:center;backface-visibility:hidden;
  }
  .book.open .cover{transform:rotateY(-166deg);box-shadow:-20px 24px 60px rgba(0,0,0,.7)}
  .cover .frame{
    position:absolute;inset:14px;border:1px solid rgba(217,180,91,.55);border-radius:2px;
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.18), inset 0 0 0 5px rgba(217,180,91,.22);
    pointer-events:none;
  }
  .cover .ct{
    font-size:20px;line-height:1.5;letter-spacing:.14em;
    background:linear-gradient(#fff3d0,var(--gold) 52%,#9c7a2c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .cover .cs{font-size:11.5px;letter-spacing:.2em;color:rgba(240,221,168,.72)}
  .cover .rule{width:52px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  /* 书页厚度 */
  .edge{
    position:absolute;top:6px;bottom:6px;right:-7px;width:9px;border-radius:0 3px 3px 0;
    background:repeating-linear-gradient(180deg,#efe6cf 0 2px,#cdbf9c 2px 4px);
    box-shadow:2px 0 6px rgba(0,0,0,.55);
  }
  .book.open .edge{opacity:0;transition:opacity .3s}

  /* 翻页光片 */
  .flip{
    position:absolute;top:0;bottom:0;left:50%;width:50%;
    transform-origin:left center;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,250,235,.95),rgba(226,214,186,.7));
    box-shadow:0 0 30px rgba(0,0,0,.35);opacity:0;border-radius:0 3px 3px 0;
  }
  .book.open .flip{animation:pageflip .8s .12s ease-in both}
  @keyframes pageflip{
    0%{opacity:.95;transform:rotateY(0)}
    100%{opacity:0;transform:rotateY(-172deg)}
  }

  /* 金光粒子 */
  .spark{
    position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:70;
    background:radial-gradient(circle,#fff6d4,rgba(217,180,91,0) 70%);
    animation:burst .95s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}
  }

  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:7px}
  .scroll::-webkit-scrollbar-thumb{background:#4a3720;border-radius:4px}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ============ 中屏：收窄摘要卡，避免压住书架 ============ */
  @media (max-width:1180px) and (min-width:821px){
    .memo{width:270px;left:16px;bottom:16px;max-height:40vh}
    .mrow .v{font-size:12px}
  }

  /* ============ 手机端 ============ */
  @media (max-width:820px){
    .books{min-height:158px}
    .books-inner{gap:4px}
    .spine .label{font-size:11px}
    .window{display:none}
    .bookcase{
      min-width:0;width:auto;max-width:none;
      margin:6px 8px 24vh;padding:12px 10px 8px;
    }
    .shelf-tag{left:8px;font-size:10.5px;letter-spacing:.14em;padding:3px 9px}
    .ghost{height:120px;width:36px}
    .plaques{gap:7px;margin:10px 0 6px}
    .plaque{font-size:11px;padding:6px 12px;letter-spacing:.1em}
    .masthead{padding:16px 0 4px}
    .hint{display:none}
    .desk{height:9vh}

    /* 摘要卡：贴底抽屉，默认折叠成一条 */
    .memo{
      left:8px;right:8px;bottom:8px;width:auto;max-height:62vh;
      transform:none;border-radius:6px;
    }
    .memo.fold{transform:translateY(calc(100% - 44px))}
    .memo-head{padding:12px 12px 8px}
    .memo-body{max-height:44vh}
    .ledger-btn{bottom:auto;top:12px;right:10px;padding:6px 10px;font-size:10.5px}
    .sfx{bottom:auto;top:12px;right:auto;left:10px;padding:5px 8px}
    .ledger{padding:0}
    .lpaper{width:100vw;max-height:100vh;height:100%;border-radius:0}
    .lline{flex-direction:column;gap:2px}
    .lline .src{min-width:0;color:#6b5528}
    .book{width:min(340px,86vw)}
  }
  @media (max-width:820px) and (orientation:landscape){
    .memo{max-height:80vh}
    .memo-body{max-height:56vh}
  }
</style>
</head>
<body>

<div class="room">
  <div class="moonbeam"></div>
  <div class="window"></div>
  <div class="floor"></div>
  <div class="scroll" id="scroll">
    <div class="masthead">
      <svg class="crest" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3d0"/><stop offset="55%" stop-color="#d9b45b"/><stop offset="100%" stop-color="#8d7132"/>
        </linearGradient></defs>
        <path d="M21 3l3.6 7.6 8.4 1-6 6 1.5 8.4L21 22.2l-7.5 3.8L15 17.6l-6-6 8.4-1z" fill="url(#g)" opacity=".95"/>
        <path d="M9 30c6 4 18 4 24 0" stroke="url(#g)" stroke-width="1.2" fill="none" opacity=".8"/>

<!-- 书桌上的羊皮纸摘要卡 -->
<aside class="memo" id="memo">

<button class="ledger-btn" id="ledgerBtn"><span class="dot off" id="ledgerDot"></span>起居注 · 数据变更</button>

<script>
/* =========================================================
   藏书目录 —— 线上版
   已单独部署的站点直接指向线上地址，其余小体量工具随本仓库打包
   本地全量版（含大体量与不公开内容）见桌面 书房.html
   ========================================================= */
const BOOKS = [
  // ——— 生活 ———
  {t:"我的日常记录", n:"日常记录", s:"运动 · 读书 · 思考 · 看房", f:"https://pokeryang.github.io/daily-records/", c:"life", p:0},
  {t:"记账助手", n:"记账助手", s:"日常收支与账目", f:"https://pokeryang.github.io/expense-tracker/", c:"life", p:1},
  {t:"工资税后测算", n:"工资测算", s:"实际到手与全年预测", f:"https://pokeryang.github.io/salary-tax/", c:"life", p:2},
  {t:"新手爸爸育儿指南", n:"育儿指南", s:"喂养 · 睡眠 · 护理", f:"t/baby-guide.html", c:"life", p:5},
  // ——— 工作 ———
  {t:"AI 与搜索知识图谱", n:"知识图谱", s:"文章沉淀 · 节点关联", f:"https://pokeryang.github.io/yang/", c:"work", p:3},
  {t:"AI Native 体验设计转变", n:"设计转变", s:"零售设计范式 · 汇报站点", f:"https://pokeryang.github.io/ai-native-design-site/", c:"work", p:3},
  {t:"即时零售品类数据", n:"品类数据", s:"类目大盘 · 加密存放", f:"t/retail-category.html", c:"work", p:1},
  {t:"淘宝闪购组织架构", n:"组织架构", s:"部门与人员 · 加密存放", f:"t/org-chart.html", c:"work", p:2},
  {t:"电商导购 Agent 架构", n:"导购架构", s:"交互式架构演示", f:"t/agent-interactive.html", c:"work", p:6},
  {t:"送花助手 Agent", n:"送花助手", s:"鲜花品类对话 demo", f:"d/flower-agent-chat-v2.html", c:"work", p:7},
];

/* 类目：每一层书架一个类目，顺序即从上到下 */
const CATS = [
  {k:"life",   label:"生活",       hint:"记账 · 日常记录 · 工资测算 · 育儿"},
  {k:"work",   label:"工作",       hint:"即时零售 · Agent 架构 · 各类 demo"},
  {k:"report", label:"我的汇报文档", hint:"待添置"},
  {k:"mba",    label:"浙大MBA",    hint:"待添置"},
];

/* 皮革色板：深红/墨绿/藏青/牛血/陈棕/紫檀/橄榄/炭黑 */
const PALETTE = [
  {a:"#7b1f2b",b:"#4a1017",n:"oxblood"},
  {a:"#1f4a34",b:"#0e2a1d",n:"forest"},
  {a:"#22355e",b:"#101c34",n:"navy"},
  {a:"#8a3b1e",b:"#4d1d0c",n:"rust"},
  {a:"#5c4327",b:"#31230f",n:"tan"},
  {a:"#4a2350",b:"#26102b",n:"plum"},
  {a:"#4d5324",b:"#282c10",n:"olive"},
  {a:"#2b2b2f",b:"#141416",n:"charcoal"},
];

/* ============ 场景装饰 ============ */
(function decorate(){
  const room=document.querySelector(".room");
  // 蜡烛
  const spots=[[8,16,44],[17,9,60],[86,14,50],[92,26,38],[74,7,54],[26,20,34]];
  spots.forEach(([x,y,h],i)=>{
    const c=document.createElement("div");
    c.className="candle";
    c.style.left=x+"%"; c.style.top=y+"%";
    c.style.animationDelay=(i*.9)+"s";
    c.innerHTML='<div class="halo"></div><div class="flame"></div><div class="wax" style="height:'+h+'px"></div>';
    room.appendChild(c);
  });
  // 尘埃
  for(let i=0;i<46;i++){
    const m=document.createElement("div");
    m.className="mote";
    const sz=Math.random()*2.6+1.2;
    m.style.width=m.style.height=sz+"px";
    m.style.left=(Math.random()*100)+"%";
    m.style.top=(Math.random()*100)+"%";
    m.style.setProperty("--dx",(Math.random()*90-45)+"px");
    m.style.setProperty("--dy",(-Math.random()*220-70)+"px");
    m.style.animationDuration=(Math.random()*16+13)+"s";
    m.style.animationDelay=(-Math.random()*20)+"s";
    room.appendChild(m);
  }
})();

/* ============ 音效（WebAudio 合成，无外部素材） ============ */
const SFX=(()=>{
  let ctx=null,on=true;
  const ac=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null} } return ctx; };
  function noise(dur,filterHz,gain,type){
    const c=ac(); if(!c||!on) return;
    const len=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,len,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.8); }
    const src=c.createBufferSource(); src.buffer=buf;
    const bq=c.createBiquadFilter(); bq.type=type||"bandpass"; bq.frequency.value=filterHz; bq.Q.value=.8;
    const g=c.createGain(); g.gain.value=gain;
    src.connect(bq).connect(g).connect(c.destination); src.start();
  }
  function tone(f1,f2,dur,gain,type){
    const c=ac(); if(!c||!on) return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f1,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),c.currentTime+dur);
    g.gain.setValueAtTime(gain,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.02);
  }
  return {
    pull(){ noise(.26,900,.055); tone(150,70,.22,.05,"triangle"); },
    open(){ noise(.55,2600,.05,"highpass"); tone(320,180,.5,.03,"sine"); },
    close(){ tone(120,55,.34,.06,"triangle"); noise(.2,600,.04); },
    toggle(){ on=!on; return on; },
    get on(){ return on; }
  };
})();

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

/* ============ 渲染书架：每层一个类目 ============ */
const bookcase=document.getElementById("bookcase");
let filter="all";

const UNIT_MIN=96, UNIT_MAX=206;
function shelfUnit(n){
  const H=window.innerHeight||900;
  const mobile=window.matchMedia("(max-width:820px)").matches;
  const mh=document.querySelector(".masthead");
  const pl=document.getElementById("plaques");
  const dk=document.querySelector(".desk");
  const head=(mh?mh.offsetHeight:112)+(pl?pl.offsetHeight:42)+(mobile?18:26);
  const foot=(dk?dk.offsetHeight:Math.max(96,H*.12))+(mobile?60:30);
  const casePad=mobile?28:32;                      // 书架上下 padding + 檐口
  const avail=H-head-foot-casePad;
  const unit=Math.floor(avail/Math.max(1,n))-24;   // 减去隔板(13)与层间距(13)
  return Math.max(UNIT_MIN,Math.min(UNIT_MAX,unit));
}

function makeSpine(b,j,unit){
  const pal=PALETTE[b.p%PALETTE.length];
  const el=document.createElement("div");
  el.className="spine";
  const name=b.n||b.t;
  const span=Math.round(unit*.22);                       // 高低错落幅度
  const h=(unit-span)+((name.length*13+j*19)%span);       // 参差但不越过隔板
  const w=Math.min(60,Math.max(38,28+name.length*4.2));  // 厚薄按书名长度
  el.style.height=h+"px"; el.style.width=w+"px";
  // 竖排标题自适应：保证整行文字塞得进书脊高度
  let units=0;
  for(const ch of name) units += /[\u4e00-\u9fff\u3000-\u303f]/.test(ch) ? 1.05 : 0.58;
  const fs=Math.max(9.5,Math.min(14,(h-18)/Math.max(1,units)));
  el.style.background="linear-gradient(90deg,"+pal.b+" 0%,"+pal.a+" 22%,"+pal.a+" 68%,"+pal.b+" 100%)";
  el.title=b.t+" — "+b.s;
  el.innerHTML='<span class="label" style="font-size:'+fs.toFixed(1)+'px">'+esc(name)+'</span>';
  el.addEventListener("click",()=>takeBook(b,el));
  return el;
}

function paint(cats,unit){
  bookcase.innerHTML="";
  cats.forEach(cat=>{
    const list=BOOKS.filter(b=>b.c===cat.k);
    const shelf=document.createElement("div"); shelf.className="shelf";
    const row=document.createElement("div"); row.className="books";
    row.style.minHeight=unit+"px";
    const inner=document.createElement("div"); inner.className="books-inner";
    if(list.length){
      list.forEach((b,j)=>inner.appendChild(makeSpine(b,j,unit)));
    }else{
      inner.className="empty-shelf";
      const narrow=window.matchMedia("(max-width:820px)").matches;
      const gh=k=>'<div class="ghost" style="height:'+Math.round(unit*k)+'px"></div>';
      inner.innerHTML = narrow
        ? gh(.8)+'<div class="empty-note">'+esc(cat.label)+' &middot; 尚未上架</div>'+gh(.7)
        : gh(.82)+gh(.7)+'<div class="empty-note">'+esc(cat.label)+' &middot; 尚未上架</div>'+gh(.76)+gh(.66);
    }
    row.appendChild(inner);
    const board=document.createElement("div"); board.className="board";
    const tag=document.createElement("div"); tag.className="shelf-tag";
    tag.innerHTML=esc(cat.label)+'<span class="n">'+(list.length?list.length+" 册":"待添置")+'</span>';
    shelf.appendChild(row); shelf.appendChild(board); shelf.appendChild(tag);
    bookcase.appendChild(shelf);
  });
  // 实测哪层放不下、需要横滑，给出右缘渐隐提示
  [...bookcase.querySelectorAll(".shelf")].forEach(s=>{
    const r=s.querySelector(".books");
    s.classList.toggle("scrollx", !!r && r.scrollWidth>r.clientWidth+2);
  });
}

function render(){
  const cats=CATS.filter(c=>filter==="all"||c.k===filter);
  let unit=shelfUnit(cats.length);
  paint(cats,unit);
  // 实测校正：书架底边不得越过讲桌顶边，否则按溢出量逐轮压缩
  const desk=document.querySelector(".desk");
  const limit=(desk?desk.getBoundingClientRect().top:window.innerHeight)-6;
  for(let i=0;i<5;i++){
    const bottom=bookcase.getBoundingClientRect().bottom;
    if(bottom<=limit || unit<=UNIT_MIN) break;
    const next=Math.max(UNIT_MIN,unit-Math.ceil((bottom-limit)/cats.length)-2);
    if(next===unit) break;
    unit=next; paint(cats,unit);
  }
  if(window.__fitMemo) window.__fitMemo();
}

const Cloud = {
  state:"idle",            // idle | locked | bad | ok | error
  records:null, expenses:null, expenseTimeKey:null,
  expCapped:false, expCutDay:"", expDays:0, expSince:"", recCapped:false,
  async headers(){
    const s=getSecret();
    return {apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"x-app-secret":s};
  },
  async verify(){
    const s=getSecret();
    if(!s){ this.state="locked"; return false; }
    try{
      // 该库的 rpc/verify_expense_secret 已不存在（PGRST202），直接拿真表探一行判定
      const r=await fetch(SB_URL+"/rest/v1/records?select=id&limit=1",{headers:await this.headers()});
      if(!r.ok){ this.state="error"; return false; }
      const rows=await r.json();
      if(Array.isArray(rows)&&rows.length){ this.state="ok"; return true; }
      // 密钥不对时 RLS 直接过滤成空数组（不是报错），此处不清除密钥——它是各站共用的
      this.state="bad"; return false;
    }catch(e){ this.state="error"; return false; }
  },
  async get(path){
    const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:await this.headers()});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  },
  // PostgREST 单次最多回 1000 行，超过要用 Range 头翻页
  async getRange(path,from,to){
    const h=Object.assign({},await this.headers(),{"Range-Unit":"items",Range:from+"-"+to});
    const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:h});
    if(!r.ok && r.status!==206) throw new Error("HTTP "+r.status);
    return r.json();
  },
  // 只要行数，不搬数据；读不到 Content-Range 就返回 null
  async count(path){
    const h=Object.assign({},await this.headers(),{"Range-Unit":"items",Range:"0-0",Prefer:"count=exact"});
    const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:h});
    if(!r.ok && r.status!==206) return null;
    const cr=r.headers.get("content-range")||"";
    const n=cr.split("/")[1];
    return (n&&n!=="*") ? Number(n) : null;
  },
  async load(force){
    if(this.records && !force) return true;
    if(!await this.verify()) return false;
    try{
      const recCap=1000;
      this.records = await this.get("records?select=id,module,time,data,updated_at&order=time.desc&limit="+recCap);
      this.recCapped = (this.records||[]).length>=recCap;
      // 记账表列名各库不同：先探一行，确认写入时间列
      const probe = await this.get("expenses?select=*&limit=1");
      const p0 = (probe && probe[0]) ? probe[0] : {};
      this.expenseTimeKey = ["updated_at","created_at","inserted_at","ts"].find(k=>k in p0) || null;
      const tk=this.expenseTimeKey;
      this.expenses=[]; this.expCapped=false; this.expCutDay=""; this.expDays=0; this.expSince="";
      if(tk){
        const cols=["amount"];
        if(cols.indexOf(tk)<0) cols.push(tk);
        if("ts" in p0 && cols.indexOf("ts")<0) cols.push("ts");
        const sel="expenses?select="+cols.join(",");
        const dayAgo=n=>new Date(Date.now()-n*86400000).toISOString().slice(0,10);
        // 该表一万五千余行，且整表被回填过写入时间：窗口开太大等于拉全表，逐级收窄到能完整取回的那档
        const BUDGET=3000, CANDS=[14,7,3,1];
        let days=CANDS[CANDS.length-1], since=dayAgo(days), total=null;
        for(const n of CANDS){
          const c=await this.count(sel+"&"+tk+"=gte."+dayAgo(n)+"&order="+tk+".desc");
          if(c===null){ days=7; since=dayAgo(7); total=null; break; }   // 读不到行数就保守取 7 天
          if(c<=BUDGET){ days=n; since=dayAgo(n); total=c; break; }
          days=n; since=dayAgo(n); total=c;                            // 记着最窄那档兜底
        }
        this.expDays=days; this.expSince=since;
        const q=sel+"&"+tk+"=gte."+since+"&order="+tk+".desc";
        const PAGE=1000, MAXP=4;
        let rows=[], p=0;
        for(; p<MAXP; p++){
          const chunk=await this.getRange(q,p*PAGE,p*PAGE+PAGE-1);
          rows=rows.concat(chunk||[]);
          if(!chunk || chunk.length<PAGE) break;
        }
        this.expenses=rows;
        this.expCapped = (p>=MAXP) || (total!==null && total>rows.length);
        // 触顶时最老那天必然只抓到一半，起居注里就不给它编数字
        this.expCutDay = this.expCapped && rows.length ? dayKey(rows[rows.length-1][tk]) : "";
      }
      return true;
    }catch(e){ this.state="error"; return false; }
  },
  unlock(){
    const v=(window.prompt("输入数据密钥以读取云端记录（与记账助手 / 日常记录同一把）：")||"").trim();
    if(!v) return false;
    setSecret(v); this.records=null; this.expenses=null; return true;
  }
};

/* ---- 小工具 ---- */
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
function dayKey(v){
  if(!v) return "";
  const s=String(v);
  // 带时区的（updated_at）先落到本地日期，否则 UTC 会把清晨写入算成前一天
  if(/(Z|[+\-]\d{2}:?\d{2})$/.test(s)){
    const d=new Date(s);
    if(!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  return s.slice(0,10);
}
function fmtDay(k){
  const [y,m,d]=k.split("-").map(Number);
  const dt=new Date(y,(m||1)-1,d||1);
  return {label:m+"月"+d+"日", week:WEEK[dt.getDay()], year:y};
}
function relDay(k){
  const t=new Date(); const today=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  if(k===today) return "今天";
  const a=new Date(k+"T00:00:00"), b=new Date(today+"T00:00:00");
  const n=Math.round((b-a)/86400000);
  if(n===1) return "昨天";
  if(n===2) return "前天";
  return n>0 ? n+" 天前" : "";
}
function cut(s,n){ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n)+"…" : s; }
function rec2obj(row){ const o=Object.assign({},row.data||{}); o.module=row.module; o.time=row.time||o.time||""; return o; }

/* 一条记录 → 摘要文案（字段名与《我的日常记录》保持一致） */
function recLine(r){
  if(r.module==="book"){
    const t=r.book?"《"+r.book+"》":"未写书名";
    const f=Number(r.fromPage), to=Number(r.toPage);
    const pg=(r.pagesRead!=null&&r.pagesRead!=="")?r.pagesRead+" 页":
      (isFinite(f)&&isFinite(to)&&to>f?(to-f)+" 页":"");
    // fromPage 常见为 0（从头读），此时页码区间没信息量，只留页数
    const rng=(isFinite(f)&&f>0&&isFinite(to)&&to>f)?("p."+f+"–"+to):"";
    return t+(pg?" · "+pg:"")+(rng?" <em>"+rng+"</em>":"")+(r.note?" <em>"+cut(r.note,26)+"</em>":"");
  }
  if(r.module==="sport"){
    const bits=[r.sport||"运动"];
    if(r.distance!=null&&r.distance!=="") bits.push(r.distance+(r.distUnit||"km"));
    if(r.duration!=null&&r.duration!=="") bits.push(r.duration+" 分钟");
    if(Array.isArray(r.parts)&&r.parts.length) bits.push(r.parts.join("/"));
    let s=bits.join(" · ");
    if(Array.isArray(r.exercises)&&r.exercises.length){
      s+=" <em>"+cut(r.exercises.map(e=>e&&(e.name||e.move)||"").filter(Boolean).join("、"),22)+"</em>";
    }
    if(r.kcal) s+=" <em>"+r.kcal+" kcal</em>";
    return s;
  }
  if(r.module==="house"){
    const bits=[r.community||r.district||"未命名楼盘"];
    if(r.area) bits.push(r.area+"㎡");
    if(r.totalPrice) bits.push("总价 "+r.totalPrice+" 万");
    if(r.unitPrice) bits.push("单价 "+r.unitPrice);
    return bits.join(" · ");
  }
  return cut(r.content||r.note||"", 60) || "（空）";
}

/* =========================================================
   摘要卡：最近有记录的一天
   ========================================================= */
const memo=document.getElementById("memo");
const memoBody=document.getElementById("memoBody");
const memoDate=document.getElementById("memoDate");
const memoPrev=document.getElementById("memoPrev");
const memoNext=document.getElementById("memoNext");
let memoDays=[], memoIdx=0;

function memoMsg(html){ memoBody.innerHTML='<div class="mrow off"><div class="v">'+html+'</div></div>'; }

async function buildMemo(force){
  memoDate.textContent="正在翻找最近的一页…";
  const ok=await Cloud.load(force);
  if(!ok){
    memoDate.textContent="云端未连通";
    if(Cloud.state==="locked"||Cloud.state==="bad"){
      memoMsg((Cloud.state==="locked"?'云端记录已加密。':'当前密钥读不到记录（密钥不对或云端为空）。')+
        '<button class="mlink" id="memoUnlock">输入数据密钥</button>');
      const u=document.getElementById("memoUnlock");
      if(u) u.onclick=()=>{ if(Cloud.unlock()) buildMemo(true); };
    }else{
      memoMsg('云端读取失败，稍后再试。<button class="mlink" id="memoRetry">重试</button>');
      const u=document.getElementById("memoRetry");
      if(u) u.onclick=()=>buildMemo(true);
    }
    return;
  }
  // 按记录自身日期（time）归日
  const byDay={};
  (Cloud.records||[]).forEach(row=>{
    const r=rec2obj(row);
    const k=dayKey(r.time);
    if(!k) return;
    (byDay[k]=byDay[k]||[]).push(r);
  });
  memoDays=Object.keys(byDay).sort().reverse();
  if(!memoDays.length){ memoDate.textContent="云端还没有记录"; memoMsg("《我的日常记录》里还没有内容。"); return; }
  window.__memoByDay=byDay;
  memoIdx=0;
  renderMemo();
}

function renderMemo(){
  const byDay=window.__memoByDay||{};
  const k=memoDays[memoIdx];
  const list=byDay[k]||[];
  const f=fmtDay(k), rel=relDay(k);
  memoDate.textContent=f.year+" 年 "+f.label+" · "+f.week+(rel?" · "+rel:"")+" · 共 "+list.length+" 条";
  const order=["book","sport","thought","house"];
  memoBody.innerHTML=order.map(m=>{
    const rs=list.filter(r=>r.module===m);
    const v=rs.length ? rs.map(recLine).join("<br>") : "—";
    return '<div class="mrow'+(rs.length?"":" off")+'">'+
      '<div class="k">'+MOD_LABEL[m]+'</div><div class="v">'+v+'</div></div>';
  }).join("");
  memoPrev.disabled = memoIdx>=memoDays.length-1;
  memoNext.disabled = memoIdx<=0;
  if(window.__fitMemo) window.__fitMemo();
}
memoPrev.onclick=()=>{ if(memoIdx<memoDays.length-1){ memoIdx++; renderMemo(); } };
memoNext.onclick=()=>{ if(memoIdx>0){ memoIdx--; renderMemo(); } };
document.getElementById("memoOpen").onclick=()=>{
  const b=BOOKS.find(x=>x.f.indexOf("daily-records")>=0);
  if(b) takeBook(b,null);

/* 桌面端窄屏：摘要卡若压住书架（层铜牌在左侧），自动折叠成标题条 */
function fitMemo(){
  if(memo.dataset.user==="1") return;
  if(window.matchMedia("(max-width:820px)").matches) return;
  memo.classList.remove("fold");
  const a=memo.getBoundingClientRect(), b=bookcase.getBoundingClientRect();
  const hit = a.right>b.left-10 && a.left<b.right+10 && a.bottom>b.top && a.top<b.bottom;
  memo.classList.toggle("fold",hit);
  memoFold.textContent = hit ? "展开" : "收起";
}
window.__fitMemo=fitMemo;

/* =========================================================
   起居注：把「每天各站点写入了什么」并到一条时间轴
   ========================================================= */
const ledger=document.getElementById("ledger");
const ledgerBody=document.getElementById("ledgerBody");
const ledgerDot=document.getElementById("ledgerDot");
const ledgerSub=document.getElementById("ledgerSub");
let ledgerLoaded=false;

function ledgerMsg(html){ ledgerBody.innerHTML='<div class="lmsg">'+html+'</div>'; }

async function buildLedger(force){
  ledgerMsg("正在核对各站点的写入…");
  const [cloudOk] = await Promise.all([Cloud.load(force), Sites.load(force)]);
  const days={};       // key -> {records:{}, exp:{fresh,freshSum,edit,tsMin,tsMax}, sites:{repo:[msg]}}
  const touch=k=>(days[k]=days[k]||{records:{},recTitles:[],
    exp:{fresh:0,freshSum:0,edit:0,tsMin:null,tsMax:null},sites:{}});

  if(cloudOk){
    // 日常记录：按写入时间（updated_at）归日，这才是「哪天写进去的」
    (Cloud.records||[]).forEach(row=>{
      const k=dayKey(row.updated_at)||dayKey(row.time);
      if(!k) return;
      const d=touch(k);
      d.records[row.module]=(d.records[row.module]||0)+1;
      if(d.recTitles.length<4){
        const r=rec2obj(row);
        d.recTitles.push(MOD_LABEL[row.module]+"：" + cut(String(recLine(r)).replace(/<[^>]+>/g,""),24));
      }
    });
    // 记账：按写入时间归日，再用账目日期 ts 分辨「当天新记的账」和「回头批量整理的旧账」
    const tk=Cloud.expenseTimeKey;
    if(tk){
      (Cloud.expenses||[]).forEach(row=>{
        const k=dayKey(row[tk]);
        if(!k) return;
        if(Cloud.expCutDay && k<=Cloud.expCutDay) return;   // 这天只抓到一半，宁可不说
        const d=touch(k), e=d.exp;
        const tsk=("ts" in row) ? dayKey(row.ts) : k;
        if(tsk===k){ e.fresh++; e.freshSum+=Math.abs(Number(row.amount)||0); }
        else{
          e.edit++;
          if(tsk){
            if(!e.tsMin||tsk<e.tsMin) e.tsMin=tsk;
            if(!e.tsMax||tsk>e.tsMax) e.tsMax=tsk;
          }
        }
      });
    }
  }
  // 站点代码/内容更新：Git 提交
  Object.keys(Sites.byRepo||{}).forEach(repo=>{
    (Sites.byRepo[repo]||[]).forEach(c=>{
      const k=dayKey(c.d);
      if(!k) return;
      const d=touch(k);
      (d.sites[repo]=d.sites[repo]||[]).push(c.m);
    });
  });

  const keys=Object.keys(days).sort().reverse().slice(0,40);
  if(!keys.length){
    ledgerMsg("暂时没抓到任何变更。<br><button class=\"bbtn\" id=\"ledgerUnlock\">输入数据密钥解锁云端</button>");
    const u=document.getElementById("ledgerUnlock");
    if(u) u.onclick=()=>{ if(Cloud.unlock()) buildLedger(true); };
    return;
  }
  const repoName=r=>{ const f=REPOS.find(x=>x.r===r); return f?f.name:r; };
  ledgerBody.innerHTML = keys.map(k=>{
    const d=days[k], f=fmtDay(k), rel=relDay(k);
    const lines=[];
    const modKeys=Object.keys(d.records);
    if(modKeys.length){
      const total=modKeys.reduce((s,m)=>s+d.records[m],0);
      const chips=modKeys.map(m=>'<span class="chip">'+MOD_LABEL[m]+" "+d.records[m]+'</span>').join("");
      lines.push('<div class="lline"><div class="src">我的日常记录</div><div class="txt">写入 '+total+' 条 '+chips+
        (d.recTitles.length?'<br><em>'+esc(d.recTitles.join(" ｜ "))+'</em>':'')+'</div></div>');
    }
    if(d.exp.fresh||d.exp.edit){
      const seg=[];
      if(d.exp.fresh) seg.push("当天记账 "+d.exp.fresh+" 笔 · 流水合计 ¥"+d.exp.freshSum.toFixed(2));
      if(d.exp.edit){
        const span=(d.exp.tsMin&&d.exp.tsMax)
          ? (d.exp.tsMin===d.exp.tsMax ? d.exp.tsMin : d.exp.tsMin+" 至 "+d.exp.tsMax)
          : "";
        seg.push("整理旧账 "+d.exp.edit+" 笔"+(span?"（账目日期 "+span+"）":""));
      }
      lines.push('<div class="lline"><div class="src">记账助手</div><div class="txt">'+
        esc(seg.join("；"))+'</div></div>');
    }
    Object.keys(d.sites).forEach(repo=>{
      const msgs=d.sites[repo];
      lines.push('<div class="lline"><div class="src">'+esc(repoName(repo))+'</div><div class="txt">站点更新 '+
        msgs.length+' 次<br><em>'+esc(msgs.slice(0,5).join(" ｜ "))+'</em></div></div>');
    });
    return '<div class="lday"><div class="ldate"><b>'+f.label+'</b><span>'+f.week+'</span>'+
      (rel?'<i>'+rel+'</i>':'')+'</div>'+lines.join("")+'</div>';
  }).join("") + ledgerFootnote(cloudOk);
  ledgerLoaded=true;
  const u=document.getElementById("ledgerUnlock2");
  if(u) u.onclick=()=>{ if(Cloud.unlock()) buildLedger(true); };
  paintDot(cloudOk);
}

function ledgerFootnote(cloudOk){
  const tk=Cloud.expenseTimeKey;
  let expNote="";
  if(cloudOk){
    if(!tk) expNote="记账表暂未读到数据。";
    else if(tk==="ts") expNote="记账表没有写入时间列，只能按账目日期归日，分不出当天记账与事后整理。";
    else{
      expNote="记账按写入时间 "+tk+" 归日，只统计最近 "+(Cloud.expDays||0)+" 天（自 "+(Cloud.expSince||"—")+
        "）：账目日期与写入同一天算「当天记账」，不同则算「整理旧账」（改分类、补旧账）；金额为流水绝对值合计，不分收支。";
      if(Cloud.expCutDay) expNote+=" 抓取到上限，"+Cloud.expCutDay+" 及更早的记账变更未计入。";
    }
  }
  return '<div class="lnote">'+
    '口径：日常记录按云端写入时间 updated_at 归日'+(Cloud.recCapped?"（仅最近 1000 条）":"")+'；'+esc(expNote)+
    '站点更新取 GitHub 提交时间，缓存 30 分钟。'+
    (cloudOk?"":'云端未解锁，只显示站点更新。<button class="mlink" id="ledgerUnlock2" style="color:#6b5528">输入数据密钥</button>')+
    (Sites.state==="limited"?" GitHub 接口限流，站点更新可能不全。":"")+
    '</div>';
}

function paintDot(cloudOk){
  ledgerDot.className="dot"+(cloudOk?"":(Sites.state==="ok"?" warn":" off"));
  ledgerSub.textContent = cloudOk ? "云端 + 站点提交，实时抓取" : "仅站点提交（云端未解锁）";
}

document.getElementById("ledgerBtn").onclick=()=>{
  ledger.classList.add("on");
  if(!ledgerLoaded) buildLedger(false);
};
function closeLedger(){ ledger.classList.remove("on"); }
document.getElementById("ledgerClose").onclick=closeLedger;
document.getElementById("lveil").onclick=closeLedger;
document.getElementById("ledgerReload").onclick=()=>buildLedger(true);

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(ledger.classList.contains("on")) closeLedger();
  else closeBook();
});

/* 启动：先摘要卡，再静默预热站点提交（不阻塞首屏） */
buildMemo(false);
setTimeout(()=>{ Sites.load(false).then(()=>paintDot(Cloud.state==="ok")); },600);
</script>
</body>
