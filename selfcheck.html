<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>嵌入页自检</title>
<style>
  body{margin:0;background:#15100a;color:#e8dcc0;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
  h1{font-size:15px;padding:10px 12px;margin:0;border-bottom:1px solid #3a2d18}
  #grid{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
  .cell{width:390px;background:#0d0a06;border:1px solid #3a2d18;border-radius:6px;overflow:hidden}
  .cap{padding:5px 8px;font-size:12px;border-bottom:1px solid #2a2010;display:flex;justify-content:space-between}
  .st{font-size:11px;color:#9a8558}
  iframe{width:390px;height:600px;border:0;display:block;background:#fff}
  pre{color:#7fe07f;font:11px/1.4 monospace;white-space:pre-wrap;padding:8px;margin:0;background:#000}
</style></head>
<body>
<h1>书房嵌入页自检 · 视口 390 × 600（与手机端书页一致）</h1>
<div id="grid"></div>
<pre id="TESTOUT">…</pre>
<script>
const BOOKS=[
 ["我的日常记录","https://pokeryang.github.io/daily-records/"],
 ["记账助手","https://pokeryang.github.io/expense-tracker/"],
 ["工资税后测算","https://pokeryang.github.io/salary-tax/"],
 ["新手爸爸育儿指南","t/baby-guide.html"],
 ["AI 与搜索知识图谱","https://pokeryang.github.io/yang/"],
 ["AI Native 体验设计转变","https://pokeryang.github.io/ai-native-design-site/"],
 ["闪购 One Agent 架构","https://pokeryang.github.io/yang/oneagent-interactive.html"],
 ["电商导购 Agent 架构","t/agent-interactive.html"],
 ["送花助手 Agent","d/flower-agent-chat-v2.html"],
 ["买菜助手 Agent","d/vegetables-agent-chat.html"],
 ["选酒助手 Agent","d/wine-agent-chat.html"],
 ["AI 落地页评测报告","t/eval-report.html"],
 ["小红书卡片生成器","t/xiaohongshu-generator.html"]
];
const res=[];
const g=document.getElementById("grid");
BOOKS.forEach(([name,src],i)=>{
  const c=document.createElement("div"); c.className="cell";
  c.innerHTML='<div class="cap"><b>'+i+". "+name+'</b><span class="st" id="st'+i+'">loading…</span></div>'+
              '<iframe id="fr'+i+'" src="'+src+'" loading="eager"></iframe>';
  g.appendChild(c);
  const fr=c.querySelector("iframe"), st=c.querySelector(".st");
  const t0=Date.now();
  fr.onload=()=>{
    let inner=null, title=null;
    try{ const d=fr.contentDocument; if(d){ inner=d.documentElement.scrollWidth; title=d.title; } }catch(e){ inner="x-origin"; }
    const r={i:i,name:name,src:src,ms:Date.now()-t0,ok:true,innerSW:inner,title:title};
    res[i]=r; st.textContent="ok "+r.ms+"ms"+(inner?(" sw"+inner):"");
    dump();
  };
  fr.onerror=()=>{ res[i]={i:i,name:name,src:src,ok:false}; st.textContent="ERROR"; dump(); };
});
function dump(){
  const done=res.filter(Boolean).length;
  document.getElementById("TESTOUT").textContent=
    "loaded "+done+"/"+BOOKS.length+"\n"+JSON.stringify(res.filter(Boolean),null,0);
}
setTimeout(()=>{
  BOOKS.forEach((b,i)=>{ if(!res[i]){ res[i]={i:i,name:b[0],src:b[1],ok:false,note:"timeout"}; } });
  dump();
},15000);
</script>
</body></html>
