<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI落地页评测报告</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1d2129;--sub:#86909c;--line:#e5e6eb;
  --green:#00b42a;--green-bg:#e8ffea;--red:#f53f3f;--red-bg:#ffece8;
  --orange:#ff7d00;--orange-bg:#fff7e8;--blue:#165dff;--blue-bg:#e8f3ff;--blue-lt:#d9f0ff;
  --purple:#722ed1;--yellow:#f7ba1e;--yellow-bg:#fffbe8;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;padding:32px 24px 80px}
.wrap{max-width:1080px;margin:0 auto}
.meta{color:var(--sub);font-size:13px;margin-bottom:6px}
h1{font-size:24px;font-weight:700;margin-bottom:28px}

.hero{background:linear-gradient(135deg,#165dff 0%,#722ed1 100%);border-radius:16px;
  padding:36px 40px;color:#fff;margin-bottom:24px;box-shadow:0 8px 24px rgba(22,93,255,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:24px}
.hero-left{flex:1;min-width:280px}
.hero-rate{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.rate-num{font-size:64px;font-weight:800;line-height:1}
.rate-label{font-size:15px;opacity:.88}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;display:flex;margin-top:16px}
.bar i{display:block;height:100%}
.bar .pass{background:#00f5a0}
.bar .fail{background:#ff7875}
.bar-legend{margin-top:12px;display:flex;gap:24px;font-size:13px;opacity:.92}
.bar-legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.hero-note{margin-top:20px;font-size:13px;opacity:.85;line-height:1.6}
.hero-right{background:rgba(255,255,255,.12);border-radius:12px;padding:20px 24px;min-width:260px;backdrop-filter:blur(4px)}
.hero-right h3{font-size:13px;font-weight:600;margin-bottom:12px;opacity:.9}
.stat-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.stat-item:last-child{border-bottom:none}
.stat-item .n{font-size:22px;font-weight:700}
.stat-item .l{font-size:12px;opacity:.8}

.mod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  cursor:pointer;transition:all .15s;position:relative}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.mod-card.active{border-color:var(--ink);box-shadow:0 0 0 2px rgba(29,33,41,.1)}
.mod-card .mod-name{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:12px;text-align:center}
.mod-card .mod-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mod-card .mod-row:last-child{margin-bottom:0}
.mod-card .mod-row-label{font-size:11px;width:50px;flex-shrink:0}
.mod-card .mod-row-bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mod-card .mod-row-bar i{display:block;height:100%;border-radius:3px}
.mod-card .mod-row-count{font-size:13px;font-weight:700;width:20px;text-align:right;flex-shrink:0}

.toolbar{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--sub);transition:.15s;user-select:none}
.chip:hover{border-color:#bbb}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.search-box{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);width:200px;margin-left:auto}
.search-box:focus{outline:none;border-color:var(--blue)}

.filter-tag{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--blue);
  font-size:12px;padding:4px 12px;border-radius:20px;margin-bottom:10px;font-weight:600}
.filter-tag .close{cursor:pointer;font-size:14px;line-height:1}

.case{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.case:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.case-head{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;user-select:none}
.case-head:hover{background:#fafbfc}
.status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}
.sb-fail{background:var(--red-bg);color:var(--red)}
.sb-pass{background:var(--green-bg);color:var(--green)}
.sb-warn{background:var(--yellow-bg);color:#d48806}
.case-q{font-size:14px;font-weight:600;flex:1}
.case-q .cls{font-size:11px;color:var(--sub);font-weight:400;margin-left:6px;background:var(--blue-bg);padding:1px 8px;border-radius:10px}
.case-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--sub)}
.case-meta b{color:var(--ink);font-weight:600}
.arrow{color:var(--sub);transition:transform .2s;font-size:12px}
.case.open .arrow{transform:rotate(90deg)}
.case-body{display:none;border-top:1px solid var(--line)}
.case.open .case-body{display:block}

.detail{padding:16px 20px 20px}
.panel{border-radius:10px;padding:16px 18px;margin-bottom:12px}
.panel:last-child{margin-bottom:0}
.panel.blocker-panel{background:var(--red-bg);border:1px solid #ffd4d0}
.panel.opt-panel{background:var(--orange-bg);border:1px solid #ffe5cc}
.panel.pass-panel{background:var(--green-bg);border:1px solid #c3f0c5}
.panel-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.panel-title .cnt{font-weight:400;color:var(--sub);font-size:12px}

.issue{padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.7);margin-bottom:8px}
.issue:last-child{margin-bottom:0}
.issue .i-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.issue .rule-tag{font-size:11px;font-family:monospace;color:var(--sub);background:rgba(0,0,0,.05);padding:1px 8px;border-radius:4px}
.issue .mod-tag{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue);font-weight:600}
.issue .i-desc{font-size:13px;color:var(--ink);margin-bottom:8px;line-height:1.6}

.fix-box{background:var(--blue-lt);border-radius:8px;padding:10px 12px;margin-top:3px}
.fix-box .fb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.fix-box .fb-title{font-size:12px;font-weight:700;color:var(--blue)}
.fix-btn{font-size:11px;padding:2px 10px;border-radius:6px;border:1px solid var(--blue);background:#fff;
  color:var(--blue);cursor:pointer;font-weight:600;transition:.12s}
.fix-btn:hover{background:var(--blue);color:#fff}
.fix-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}
.fix-box .fb-text{font-size:13px;color:var(--ink);line-height:1.6}

.pass-summary{padding:20px;text-align:center;color:var(--green);font-size:14px;font-weight:500}

.rule-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;padding:4px 0}
.rule-item{display:flex;align-items:center;gap:6px;padding:3px 0}
.rule-item .r-icon{flex-shrink:0;width:16px;text-align:center}
.rule-item .r-id{font-family:monospace;color:var(--sub);min-width:44px}
.rule-item .r-name{flex:1;color:var(--ink)}
.rule-item .r-note{color:var(--sub);font-size:11px;margin-left:4px}

.section-title{font-size:17px;font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:8px}

@media(max-width:900px){
  .mod-grid{grid-template-columns:repeat(2,1fr)}
  .rule-list{grid-template-columns:1fr}
}
@media(max-width:760px){
  .hero-top{flex-direction:column}
  .hero-right{width:100%}
  .rate-num{font-size:48px}
  .mod-grid{grid-template-columns:repeat(2,1fr)}
  .search-box{width:100%;margin-left:0;margin-top:8px}
}
</style>
</head>

let currentFilter = "all";
let currentSearch = "";
let currentMod = null;

function renderModGrid(){
  const grid = document.getElementById("modGrid");
  const maxB = Math.max(1,...MOD_ORDER.map(m=>MOD_STATS[m].bottom));
  const maxO = Math.max(1,...MOD_ORDER.map(m=>MOD_STATS[m].opt));
  let html = "";
  for(const mod of MOD_ORDER){
    const s = MOD_STATS[mod];
    const ac = currentMod===mod?"active":"";
    const bPct = s.bottom>0?Math.round(s.bottom/maxB*100):0;
    const oPct = s.opt>0?Math.round(s.opt/maxO*100):0;
    html += '<div class="mod-card '+ac+'" onclick="toggleModFilter(\''+mod+'\')">';
    html += '<div class="mod-name">'+mod+'</div>';
    html += '<div class="mod-row"><span class="mod-row-label" style="color:var(--red)">底线问题</span><div class="mod-row-bar"><i style="width:'+bPct+'%;background:var(--red)"></i></div><span class="mod-row-count" style="color:var(--red)">'+s.bottom+'</span></div>';
    html += '<div class="mod-row"><span class="mod-row-label" style="color:var(--orange)">优化建议</span><div class="mod-row-bar"><i style="width:'+oPct+'%;background:var(--orange)"></i></div><span class="mod-row-count" style="color:var(--orange)">'+s.opt+'</span></div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function toggleModFilter(mod){
  currentMod = currentMod===mod?null:mod;
  renderActiveFilter();
  render();
}
function renderActiveFilter(){
  const c = document.getElementById("activeFilter");
  c.innerHTML = currentMod?'<span class="filter-tag">正在查看「'+currentMod+'」模块有问题的query <span class="close" onclick="clearModFilter()">&times;</span></span>':"";
}
function clearModFilter(){currentMod=null;renderActiveFilter();render();}

function getFilteredCases(){
  let cases = ALL_CASES;
  if(currentFilter==="fail") cases = cases.filter(c=>!c.pass);
  if(currentFilter==="pass") cases = cases.filter(c=>c.pass);
  if(currentSearch){const s=currentSearch.toLowerCase();cases=cases.filter(c=>c.q.toLowerCase().includes(s));}
  if(currentMod){const qs=MOD_QUERIES[currentMod]||[];cases=cases.filter(c=>qs.includes(c.q));}
  return cases;
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  document.querySelector('.chip[data-filter="'+f+'"]').classList.add("active");
  render();
}
function onSearch(){currentSearch=document.getElementById("searchBox").value;render();}

function toggleCase(el){el.parentElement.classList.toggle("open");}

function copyFix(btn,text){
  navigator.clipboard.writeText(text).then(()=>{btn.textContent="已复制";btn.classList.add("copied");setTimeout(()=>{btn.textContent="复制";btn.classList.remove("copied");},2000);}).catch(()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
    btn.textContent="已复制";btn.classList.add("copied");setTimeout(()=>{btn.textContent="复制";btn.classList.remove("copied");},2000);
  });
}

function renderRuleList(rules){
  let html='<div class="rule-list">';
  for(const [id,name,status,note] of rules){
    const icon = status==="pass"?'<span style="color:var(--green)">✓</span>':status==="fail"?'<span style="color:var(--red)">✗</span>':'<span style="color:var(--sub)">-</span>';
    const nameStyle = status==="fail"?'color:var(--red);font-weight:600':"";
    html+='<div class="rule-item"><span class="r-icon">'+icon+'</span><span class="r-id">'+id+'</span><span class="r-name" style="'+nameStyle+'">'+name+'</span>'+(note?'<span class="r-note">'+note+'</span>':"")+'</div>';
  }
  html+='</div>';
  return html;
}

function renderIssue(issue,idx){
  const btnId="fixBtn_"+idx;
  const esc=(s)=>s.replace(/"/g,"&quot;").replace(/'/g,"\\'");
  return '<div class="issue"><div class="i-head"><span class="rule-tag">'+issue.id+'</span><span class="mod-tag">'+issue.mod+'</span></div><div class="i-desc">'+issue.desc+'</div><div class="fix-box"><div class="fb-head"><span class="fb-title">修复建议</span><button class="fix-btn" id="'+btnId+'" onclick="copyFix(this,\''+esc(issue.fix)+'\')">复制</button></div><div class="fb-text">'+issue.fix+'</div></div></div>';
}

function render(){
  const cases = getFilteredCases();
  const list = document.getElementById("caseList");
  list.innerHTML = cases.map((c,ci)=>{
    const bCount = c.blockers.length;
    const oCount = c.opts.length;
    let badge,body,metaHtml;

    if(bCount>0){
      badge='<span class="status-badge sb-fail">不合格</span>';
      let panels='';
      panels+='<div class="panel blocker-panel"><div class="panel-title" style="color:var(--red)">底线问题 <span class="cnt">('+bCount+'条)</span></div>';
      c.blockers.forEach((b,i)=>{panels+=renderIssue(b,"b"+ci+"_"+i);});
      panels+='</div>';
      if(oCount>0){
        panels+='<div class="panel opt-panel"><div class="panel-title" style="color:var(--orange)">优化建议 <span class="cnt">('+oCount+'条)</span></div>';
        c.opts.forEach((o,i)=>{panels+=renderIssue(o,"o"+ci+"_"+i);});
        panels+='</div>';
      }
      panels+=renderModuleDetail(c);
      body='<div class="detail">'+panels+'</div>';
      metaHtml='<div class="case-meta"><span>底线 <b style="color:var(--red)">'+bCount+'</b></span><span>优化 <b style="color:var(--orange)">'+oCount+'</b></span></div>';
    } else if(oCount>0){
      badge='<span class="status-badge sb-warn">通过 · 有优化建议</span>';
      let panels='';
      panels+='<div class="panel opt-panel"><div class="panel-title" style="color:var(--orange)">优化建议 <span class="cnt">('+oCount+'条)</span></div>';
      c.opts.forEach((o,i)=>{panels+=renderIssue(o,"o"+ci+"_"+i);});
      panels+='</div>';
      panels+=renderModuleDetail(c);
      body='<div class="detail">'+panels+'</div>';
      metaHtml='<div class="case-meta"><span style="color:#d48806">优化建议 <b>'+oCount+'</b> 条</span></div>';
    } else {
      badge='<span class="status-badge sb-pass">通过</span>';
      let panels=renderModuleDetail(c);
      body='<div class="detail"><div class="pass-summary"><div style="font-size:22px;margin-bottom:6px">✓</div><div>全部底线规则通过，无优化建议</div></div>'+panels+'</div>';
      metaHtml='<div class="case-meta"><span>全部通过</span></div>';
    }
    return '<div class="case"><div class="case-head" onclick="toggleCase(this)">'+badge+'<div class="case-q">'+c.q+'<span class="cls">'+c.cls+'</span></div>'+metaHtml+'<span class="arrow">▶</span></div><div class="case-body">'+body+'</div></div>';
  }).join('');
  renderModGrid();
}

function renderModuleDetail(c){
  let html='';
  for(const mod of MOD_ORDER){
    const m = c.modules[mod];
    if(!m) continue;
    const cls = m.pass?"pass-panel":"blocker-panel";
    const icon = m.pass?"✓":"✗";
    const titleColor = m.pass?"var(--green)":"var(--red)";
    html+='<div class="panel '+cls+'">';
    html+='<div class="panel-title" style="color:'+titleColor+'">'+icon+' '+mod+'</div>';
    html+=renderRuleList(m.rules);
    html+='</div>';
  }
  return html;
}

render();
