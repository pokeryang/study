<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书卡片生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }

/* 顶部输入区 */
.input-section {
  max-width: 800px;
  margin: 40px auto 30px;
  padding: 0 20px;
}
.input-section h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #1d1d1f;
}
.input-section p.subtitle {
  font-size: 14px;
  color: #86868b;
  margin-bottom: 24px;
}
.input-group {
  margin-bottom: 16px;
}
.input-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #6e6e73;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.input-group input,
.input-group textarea,
.input-group select {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #d2d2d7;
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus {
  border-color: #ff2442;
  box-shadow: 0 0 0 3px rgba(255, 36, 66, 0.1);
}
.input-group textarea {
  min-height: 180px;
  resize: vertical;
  line-height: 1.6;
}
.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.btn-generate {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  background: #ff2442;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  margin-top: 8px;
}
.btn-generate:hover { background: #e8203c; }
.btn-generate:active { transform: scale(0.97); }

/* 输出区 */
.output-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 60px;
}
.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.output-header h2 {
  font-size: 22px;
  font-weight: 700;
}
.btn-download-all {
  padding: 10px 20px;
  background: #1d1d1f;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-download-all:hover { opacity: 0.8; }

/* 卡片网格 */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}
.card-wrapper {
  position: relative;
}
.card-wrapper .card-label {
  font-size: 12px;
  font-weight: 600;
  color: #86868b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

/* 小红书卡片本体 - 3:4 比例 */
.xhs-card {
  width: 100%;
  aspect-ratio: 3/4;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  text-align: center;
}
.xhs-card.cover {
  color: #fff;
}
.xhs-card.cover .cover-title {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 16px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.xhs-card.cover .cover-subtitle {
  font-size: 16px;
  opacity: 0.9;
  line-height: 1.5;
}
.xhs-card.cover .cover-tag {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}

/* 内页卡片 */
.xhs-card.content-page {
  background: #fff;
  color: #1d1d1f;
  text-align: left;
  justify-content: flex-start;
  padding: 36px 32px;
  border: 1px solid #e8e8ed;
}
.xhs-card.content-page .page-number {
  position: absolute;
  top: 20px;
  right: 24px;
  font-size: 12px;
  color: #86868b;
  font-weight: 500;
}
.xhs-card.content-page .page-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 16px;
  line-height: 1.3;
}
.xhs-card.content-page .page-content {
  font-size: 15px;
  line-height: 1.8;
  color: #3a3a3c;
  flex: 1;
}
.xhs-card.content-page .page-content .highlight {
  background: linear-gradient(transparent 60%, rgba(255,36,66,0.15) 60%);
  font-weight: 600;
}
.xhs-card.content-page .page-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #f0f0f0;
  font-size: 12px;
  color: #86868b;
}

/* 文案区 */
.copytext-section {
  margin-top: 30px;
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  border: 1px solid #e8e8ed;
}
.copytext-section h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
}
.copytext-block {
  margin-bottom: 16px;
}
.copytext-block label {
  font-size: 12px;
  font-weight: 600;
  color: #86868b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 6px;
}
.copytext-block .text-content {
  background: #f5f5f7;
  border-radius: 10px;
  padding: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: #1d1d1f;
  white-space: pre-wrap;
  cursor: text;
  position: relative;
  min-height: 60px;
}
.copytext-block .text-content[contenteditable="true"]:focus {
  outline: 2px solid #ff2442;
  outline-offset: 2px;
}
.btn-copy {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  padding: 6px 14px;
  background: #f5f5f7;
  border: 1px solid #d2d2d7;
  border-radius: 8px;
  font-size: 12px;
  color: #6e6e73;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-copy:hover { background: #e8e8ed; color: #1d1d1f; }
.btn-copy.copied { background: #34c759; color: #fff; border-color: #34c759; }

/* 单卡下载按钮 */
.btn-save-card {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  padding: 6px 14px;
  background: #f5f5f7;
  border: 1px solid #d2d2d7;
  border-radius: 8px;
  font-size: 12px;
  color: #6e6e73;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-save-card:hover { background: #e8e8ed; color: #1d1d1f; }

/* 色板选择 */
.palette-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.palette-option {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: border-color 0.2s, transform 0.1s;
}
.palette-option:hover { transform: scale(1.1); }
.palette-option.active { border-color: #1d1d1f; }

.hidden { display: none; }

/* 响应式 */
@media (max-width: 680px) {
  .row-2 { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  .xhs-card { padding: 28px 24px; }
  .xhs-card.cover .cover-title { font-size: 26px; }
}
</style>
</head>
<body>

<div class="input-section">
  <h1>小红书卡片生成器</h1>
  <p class="subtitle">输入文章主题和内容，一键生成封面 + 内页卡片 + 发布文案</p>

  <div class="input-group">
    <label>文章标题 / 主题</label>
    <input type="text" id="articleTitle" placeholder="例：5个让效率翻倍的AI工具推荐">
  </div>

  <div class="input-group">
    <label>文章内容（粘贴原文，系统自动提炼关键信息生成卡片）</label>
    <textarea id="articleContent" placeholder="粘贴你的文章全文、要点列表或笔记草稿...&#10;&#10;系统会自动：&#10;1. 提炼核心观点，拆分为多页卡片&#10;2. 生成吸引眼球的封面标题&#10;3. 撰写小红书风格的发布文案"></textarea>
  </div>

  <div class="row-2">
    <div class="input-group">
      <label>卡片页数（含封面）</label>
      <select id="cardCount">
        <option value="3">3 页（封面 + 2 内页）</option>
        <option value="4">4 页（封面 + 3 内页）</option>
        <option value="5" selected>5 页（封面 + 4 内页）</option>
        <option value="6">6 页（封面 + 5 内页）</option>
        <option value="7">7 页（封面 + 6 内页）</option>
      </select>
    </div>
    <div class="input-group">
      <label>配色方案</label>
      <div class="palette-picker" id="palettePicker">
        <div class="palette-option active" data-palette="red" style="background: linear-gradient(135deg, #ff2442, #ff6b81);" title="小红书红"></div>
        <div class="palette-option" data-palette="blue" style="background: linear-gradient(135deg, #007aff, #5ac8fa);" title="清新蓝"></div>
        <div class="palette-option" data-palette="purple" style="background: linear-gradient(135deg, #af52de, #da8fff);" title="梦幻紫"></div>
        <div class="palette-option" data-palette="green" style="background: linear-gradient(135deg, #34c759, #a8e063);" title="自然绿"></div>
        <div class="palette-option" data-palette="orange" style="background: linear-gradient(135deg, #ff9500, #ffcc02);" title="活力橙"></div>
        <div class="palette-option" data-palette="dark" style="background: linear-gradient(135deg, #1d1d1f, #48484a);" title="高级黑"></div>
      </div>
    </div>
  </div>

  <button class="btn-generate" id="btnGenerate" onclick="generateCards()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    生成小红书内容
  </button>
</div>

<div class="output-section hidden" id="outputSection">
  <div class="output-header">
    <h2>生成结果</h2>
    <button class="btn-download-all" onclick="downloadAllCards()">全部下载为图片</button>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="copytext-section" id="copytextSection"></div>
</div>

<!-- html2canvas CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const PALETTES = {
  red:    { gradient: 'linear-gradient(135deg, #ff2442 0%, #ff6b81 50%, #ffa07a 100%)', accent: '#ff2442' },
  blue:   { gradient: 'linear-gradient(135deg, #007aff 0%, #5ac8fa 50%, #b3e0ff 100%)', accent: '#007aff' },
  purple: { gradient: 'linear-gradient(135deg, #af52de 0%, #da8fff 50%, #f0c6ff 100%)', accent: '#af52de' },
  green:  { gradient: 'linear-gradient(135deg, #34c759 0%, #a8e063 50%, #d4fc79 100%)', accent: '#34c759' },
  orange: { gradient: 'linear-gradient(135deg, #ff9500 0%, #ffcc02 50%, #ffe066 100%)', accent: '#ff9500' },
  dark:   { gradient: 'linear-gradient(135deg, #1d1d1f 0%, #48484a 50%, #636366 100%)', accent: '#48484a' },
};

let currentPalette = 'red';

// 色板切换
document.querySelectorAll('.palette-option').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.palette-option').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    currentPalette = el.dataset.palette;
  });
});

function generateCards() {
  const title = document.getElementById('articleTitle').value.trim();
  const content = document.getElementById('articleContent').value.trim();
  const pageCount = parseInt(document.getElementById('cardCount').value);

  if (!title && !content) {
    alert('请输入文章标题或内容');
    return;
  }

  const palette = PALETTES[currentPalette];
  const innerPages = pageCount - 1;

  // 智能分段
  const sections = splitContent(content, innerPages);

  // 生成封面
  const coverTitle = generateCoverTitle(title, content);
  const coverSubtitle = generateCoverSubtitle(title, content);

  // 渲染卡片
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  // 封面
  grid.innerHTML += '<div class="card-wrapper"><div class="card-label">封面</div><div class="xhs-card cover" id="card-0" style="background: ' + palette.gradient + ';"><div class="cover-title" contenteditable="true">' + coverTitle + '</div><div class="cover-subtitle" contenteditable="true">' + coverSubtitle + '</div><div class="cover-tag" contenteditable="true">#' + extractTag(title, content) + '</div></div><button class="btn-save-card" onclick="downloadCard(0)">保存图片</button></div>';

  // 内页
  for (let i = 0; i < innerPages; i++) {
    const section = sections[i] || {};
    grid.innerHTML += '<div class="card-wrapper"><div class="card-label">第 ' + (i+1) + ' 页</div><div class="xhs-card content-page" id="card-' + (i+1) + '"><div class="page-number">' + (i+1) + ' / ' + innerPages + '</div><div class="page-title" contenteditable="true" style="color: ' + palette.accent + ';">' + (section.title || ('要点 ' + (i+1))) + '</div><div class="page-content" contenteditable="true">' + (section.body || '点击此处编辑内容...') + '</div><div class="page-footer" contenteditable="true">左滑查看更多 →</div></div><button class="btn-save-card" onclick="downloadCard(' + (i+1) + ')">保存图片</button></div>';
  }

  // 生成文案
  const copySection = document.getElementById('copytextSection');
  const copyData = generateCopyText(title, content, sections);
  copySection.innerHTML = '<h3>发布文案</h3><div class="copytext-block"><label>标题（30字以内）</label><div class="text-content" contenteditable="true" id="copyTitle">' + copyData.noteTitle + '</div><button class="btn-copy" onclick="copyText(\'copyTitle\', this)">复制标题</button></div><div class="copytext-block"><label>正文</label><div class="text-content" contenteditable="true" id="copyBody">' + copyData.noteBody + '</div><button class="btn-copy" onclick="copyText(\'copyBody\', this)">复制正文</button></div><div class="copytext-block"><label>话题标签</label><div class="text-content" contenteditable="true" id="copyTags">' + copyData.tags + '</div><button class="btn-copy" onclick="copyText(\'copyTags\', this)">复制标签</button></div>';

  document.getElementById('outputSection').classList.remove('hidden');
  document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- 内容智能拆分 ----
function splitContent(content, count) {
  if (!content) return Array(count).fill({ title: '', body: '' });

  let parts = [];
  const numberedRegex = /(?:^|\n)\s*(?:(\d+)[.、)）]|([一二三四五六七八九十]+)[、.）)])\s*(.+)/g;
  let match;
  const numberedItems = [];
  while ((match = numberedRegex.exec(content)) !== null) {
    numberedItems.push(match[3].trim());
  }

  if (numberedItems.length >= count) {
    parts = numberedItems.slice(0, count);
  } else {
    const paragraphs = content.split(/\n{2,}|\n/).filter(p => p.trim().length > 0);
    if (paragraphs.length >= count) {
      const chunkSize = Math.ceil(paragraphs.length / count);
      for (let i = 0; i < count; i++) {
        parts.push(paragraphs.slice(i * chunkSize, (i + 1) * chunkSize).join('\n'));
      }
    } else {
      const totalLen = content.length;
      const segLen = Math.ceil(totalLen / count);
      for (let i = 0; i < count; i++) {
        parts.push(content.slice(i * segLen, (i + 1) * segLen));
      }
    }
  }

  return parts.map((p, i) => {
    const lines = p.split('\n').filter(l => l.trim());
    const title = extractSectionTitle(lines[0] || '', i);
    const body = formatBodyText(lines.length > 1 ? lines.slice(1).join('<br>') : lines[0] || '');
    return { title, body };
  });
}

function extractSectionTitle(text, index) {
  const clean = text.replace(/^[\d一二三四五六七八九十]+[.、)）:\s]*/,'');
  if (clean.length <= 20) return clean;
  const cut = clean.match(/^(.{8,20})[，。、；！？]/);
  return cut ? cut[1] : clean.slice(0, 18) + '...';
}

function formatBodyText(text) {
  return text
    .replace(/[「」【】《》]/g, '')
    .replace(/(重要|关键|核心|注意|技巧|秘诀|必须|一定要)/g, '<span class="highlight">$1</span>');
}

// ---- 封面标题生成 ----
function generateCoverTitle(title, content) {
  if (title) {
    if (title.length <= 15) return title;
    return title.slice(0, 20);
  }
  const firstLine = content.split('\n')[0] || '精华分享';
  return firstLine.slice(0, 20);
}

function generateCoverSubtitle(title, content) {
  if (!content) return '左滑查看详细内容';
  const sentences = content.match(/[^。！？\n]+[。！？]?/g) || [];
  if (sentences.length > 1) return sentences[1].trim().slice(0, 30);
  return '左滑查看详细内容';
}

function extractTag(title, content) {
  const combined = (title + ' ' + content).slice(0, 100);
  const keywords = combined.match(/[A-Za-z\u4e00-\u9fa5]{2,6}/g) || ['干货分享'];
  return keywords.slice(0, 2).join(' #');
}

// ---- 发布文案生成 ----
function generateCopyText(title, content, sections) {
  const noteTitle = title ? (title.length > 30 ? title.slice(0, 28) + '...' : title) : '分享一个超实用的干货';

  let noteBody = '';
  const emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣'];
  sections.forEach((s, i) => {
    if (s.title) {
      noteBody += (emojis[i] || '•') + ' ' + s.title + '\n';
    }
  });
  noteBody += '\n---\n觉得有用就收藏+关注吧！\n后续持续更新更多干货内容~';

  const tagWords = extractTagWords(title, content);
  const tags = tagWords.map(t => '#' + t).join(' ');

  return { noteTitle, noteBody, tags };
}

function extractTagWords(title, content) {
  const text = (title + ' ' + content).slice(0, 200);
  const defaults = ['干货分享', '知识分享', '自我提升'];
  const found = text.match(/[A-Za-z]{3,12}|[\u4e00-\u9fa5]{2,4}/g) || [];
  const unique = [...new Set(found)].filter(w => w.length >= 2).slice(0, 3);
  return unique.length >= 2 ? unique : defaults;
}

// ---- 下载功能 ----
async function downloadCard(index) {
  const card = document.getElementById('card-' + index);
  if (!card) return;
  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: null,
    });
    const link = document.createElement('a');
    link.download = 'xiaohongshu-' + (index === 0 ? 'cover' : 'page-' + index) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('下载失败，请尝试右键截图保存');
  }
}

async function downloadAllCards() {
  const cards = document.querySelectorAll('.xhs-card');
  for (let i = 0; i < cards.length; i++) {
    await downloadCard(i);
    await new Promise(r => setTimeout(r, 500));
  }
}

// ---- 复制功能 ----
function copyText(elementId, btn) {
  const el = document.getElementById(elementId);
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.textContent = '已复制';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '复制';
    }, 1500);
  });
}
</script>
</body>
</html>
