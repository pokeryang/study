<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>闪购千问</title>
<style>
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Bd.ttf") format("truetype");
  font-weight: 700;
}
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Rg.ttf") format("truetype");
  font-weight: 400;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 13.333vw; }
body {
  font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #F3F6F8;
  height: 100vh;
  overflow: hidden;
}
.app {
  width: 100%;
  max-width: 7.5rem;
  margin: 0 auto;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== Views ===== */
.view {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.home-view {
  z-index: 1;
  background: #F3F6F8;
  transform: translateX(0);
}
.home-view.behind {
  transform: translateX(-22%);
}
.assistant-view {
  z-index: 2;
  background: #F3F6F8;
  transform: translateX(100%);
  box-shadow: -0.04rem 0 0.24rem rgba(17, 25, 45, 0.06);
  visibility: hidden;
  pointer-events: none;
}
.assistant-view.opening,
.assistant-view.active {
  visibility: visible;
  pointer-events: auto;
}
.assistant-view.active {
  transform: translateX(0);
}

/* ===== Nav Bar ===== */
.nav-bar {
  height: 1.76rem;
  background: #FFFFFF;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.status-bar { height: 0.88rem; }
.nav-content {
  height: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.2rem;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 0.16rem;
}
.nav-icon {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.nav-icon svg { width: 0.4rem; height: 0.373rem; }
.nav-title {
  font-size: 0.36rem;
  font-weight: 500;
  color: #11192D;
}
.nav-right {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-right svg { width: 0.4rem; height: 0.4rem; }

/* ===== Home View ===== */
.home-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.32rem 0.32rem 0.24rem;
  display: flex;
  flex-direction: column;
  gap: 0.52rem;
}
.home-content::-webkit-scrollbar { display: none; }
.home-bottom {
  background: #FFFFFF;
  padding: 0.18rem 0.24rem 0.56rem;
  flex-shrink: 0;
  border-top: 0.01rem solid #F3F6F8;
}
.home-toolbar {
  display: flex;
  gap: 0.14rem;
  margin-bottom: 0.18rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.home-toolbar::-webkit-scrollbar { display: none; }
.home-toolbar-item {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0.24rem;
  border: 0.015rem solid #E5E8EC;
  border-radius: 0.12rem;
  font-size: 0.26rem;
  color: #11192D;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
  background: #FFFFFF;
}
.home-toolbar-item img { width: 0.32rem; height: 0.32rem; }
.home-input-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0.16rem;
  border: 0.015rem solid rgba(229,232,236,0.8);
  border-radius: 0.2rem;
  height: 0.92rem;
  cursor: pointer;
}
.home-input-placeholder {
  font-size: 0.28rem;
  color: #7C889C;
}
.home-input-hint {
  text-align: center;
  font-size: 0.18rem;
  color: #CACFD7;
  margin-top: 0.12rem;
}

/* ===== Assistant Chat Area ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.32rem 0.32rem 0.24rem;
  display: flex;
  flex-direction: column;
  gap: 0.52rem;
}
.chat-area::-webkit-scrollbar { display: none; }

/* ===== Messages ===== */
.message-row {
  display: flex;
  width: 100%;
  margin-bottom: 0.52rem;
}
.message-row:last-child { margin-bottom: 0; }
.message-row.user { justify-content: flex-end; }
.message-row.assistant { justify-content: flex-start; }

.user-bubble {
  max-width: 5rem;
  padding: 0.16rem 0.32rem;
  background: #FFE6D7;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.48rem;
  word-break: break-all;
}

.assistant-card {
  width: 100%;
  max-width: 6.86rem;
  background: #FFFFFF;
  border-radius: 0.12rem;
  overflow: hidden;
}

/* ===== Welcome Card ===== */
.welcome-card {
  background: linear-gradient(180deg, #F9FBFF 0%, #FFFFFF 100%);
  padding: 0.4rem 0.24rem 0.24rem;
  border-radius: 0.12rem;
}
.welcome-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.32rem;
}
.welcome-badge {
  display: inline-block;
  padding: 0.04rem 0.14rem;
  background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%);
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #111111;
  margin-bottom: 0.08rem;
}
.welcome-title {
  font-size: 0.48rem;
  font-weight: 500;
  color: #111111;
  line-height: 0.67rem;
}
.welcome-subtitle {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
}
.welcome-mascot {
  width: 1.88rem;
  height: 2.04rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.scenario-list {
  display: flex;
  flex-direction: column;
  gap: 0.16rem;
}
.scenario-item {
  height: 1.51rem;
  border-radius: 0.16rem;
  padding: 0.32rem 0.4rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
}
.scenario-item:active { transform: scale(0.98); }
.scenario-item:nth-child(1) { background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%); }
.scenario-item:nth-child(2) { background: linear-gradient(270deg, #FFFEF8 0%, #FFF5F5 100%); }
.scenario-item:nth-child(3) { background: linear-gradient(270deg, #FDFFF8 0%, #FDFFEC 100%); }
.scenario-title {
  font-size: 0.32rem;
  color: #111111;
  line-height: 0.45rem;
  font-weight: 500;
}
.scenario-desc {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
  line-height: 0.34rem;
}

/* ===== Address Card ===== */
.address-card { padding: 0.24rem; }
.address-text {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.16rem;
}
.address-current {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0;
  margin-bottom: 0.16rem;
}
.address-current svg { width: 0.32rem; height: 0.32rem; flex-shrink: 0; }
.address-current span {
  font-size: 0.28rem;
  color: #11192D;
}
.address-actions {
  display: flex;
  gap: 0.16rem;
}
.address-btn {
  flex: 1;
  height: 0.8rem;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.3rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
}
.address-btn.secondary {
  background: #F3F6F8;
  color: #50607A;
}
.address-btn.primary {
  background: #FF6200;
  color: #FFFFFF;
}

/* ===== Clarify Card ===== */
.clarify-card { padding: 0.24rem; }
.clarify-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.clarify-header span {
  font-size: 0.28rem;
  color: #50607A;
}
.clarify-header svg { width: 0.28rem; height: 0.28rem; }
.clarify-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.clarify-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.24rem;
}
.clarify-question {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.16rem;
}
.clarify-options {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
}
.clarify-option {
  display: flex;
  align-items: center;
  gap: 0.16rem;
  padding: 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  cursor: pointer;
  background: #FFFFFF;
  transition: all 0.15s;
}
.clarify-option:active { background: #F9FBFF; }
.option-checkbox {
  width: 0.32rem;
  height: 0.32rem;
  border: 0.035rem solid #CACFD7;
  border-radius: 50%;
  flex-shrink: 0;
}
.option-text {
  font-size: 0.28rem;
  color: #11192D;
}

/* ===== Thinking Card ===== */
.thinking-card { padding: 0.24rem; position: relative; }
.thinking-steps-container {
  position: relative;
}
.thinking-step-group {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transform: translateY(0.2rem);
  transition: all 0.5s ease;
}
.thinking-step-group.visible {
  opacity: 1;
  transform: translateY(0);
}
.thinking-step-group .thinking-step {
  display: flex;
  align-items: flex-start;
  gap: 0.16rem;
  margin-bottom: 0.08rem;
}
.thinking-step-group .thinking-step svg { width: 0.3rem; height: 0.3rem; flex-shrink: 0; margin-top: 0.02rem; }
.thinking-step-group .thinking-step-title {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.36rem;
}
.thinking-step-group .thinking-step-desc {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.44rem;
  margin-left: 0.46rem;
}

/* ===== Listcard (攻略型结果) ===== */
.listcard { padding: 0.24rem; }
.listcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.listcard-header span { font-size: 0.28rem; color: #50607A; }
.listcard-header svg { width: 0.28rem; height: 0.28rem; }
.listcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.listcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.listcard-desc b {
  font-size: 0.3rem;
  display: inline-block;
  margin-top: 0.04rem;
}
.listcard-gradient {
  position: absolute;
  top: 0; right: 0;
  width: 1.56rem;
  height: 1.69rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
}
.list-product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
  display: flex;
  gap: 0.24rem;
}
.list-product-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.list-product-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
}
.list-product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-top: 0.04rem;
  margin-bottom: 0.08rem;
}
.list-product-meta {
  font-size: 0.24rem;
  color: #50607A;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.16rem;
}
.list-product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.04rem;
}
.list-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.list-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.list-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
}

/* ===== Bigcard ===== */
.bigcard { padding: 0.24rem; }
.bigcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.bigcard-header span { font-size: 0.28rem; color: #50607A; }
.bigcard-header svg { width: 0.28rem; height: 0.28rem; }
.bigcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.bigcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.product-cards-scroll {
  display: flex;
  gap: 0.16rem;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -0.24rem;
  padding: 0 0.24rem;
}
.product-cards-scroll::-webkit-scrollbar { display: none; }
.product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.24rem;
  margin-bottom: 0.16rem;
  width: 5.92rem;
  flex-shrink: 0;
}
.product-image-wrap {
  position: relative;
  margin-bottom: 0.12rem;
}
.product-image-overlay {
  position: absolute;
  bottom: 0.16rem;
  left: 0.16rem;
  background: rgba(14, 17, 25, 0.5);
  border-radius: 0.08rem;
  padding: 0.06rem 0.12rem;
  font-size: 0.22rem;
  color: #FFFFFF;
}
.shop-header {
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
  margin-bottom: 0.12rem;
}
.shop-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  white-space: nowrap;
}
.shop-meta {
  font-size: 0.26rem;
  color: #50607A;
  white-space: nowrap;
}
.product-image {
  width: 100%;
  height: 4.08rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127231384010781/183107002341513/e4b133ee9ff9f04420d7c736fc131a86.webp);
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  margin-bottom: 0.12rem;
}
.product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-bottom: 0.03rem;
}
.product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  margin-top: 0.08rem;
  margin-bottom: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.price-current {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.price-prefix {
  font-size: 0.26rem;
  font-weight: 500;
  color: #FF6200;
  margin-bottom: 0.04rem;
  transform: translateY(2px);
}
.price-unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.price-value {
  font-size: 0.4rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
  line-height: 0.42rem;
}
.price-original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
  transform: translateY(2px);
}
.select-btn {
  width: 100%;
  height: 0.8rem;
  background: #FF6200;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 0.3rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  margin-top: 0.12rem;
}
.bigcard-footer {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-top: 0.16rem;
}
.action-bar {
  display: flex;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.action-btn {
  width: 0.6rem;
  height: 0.6rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  cursor: pointer;
}
.suggestion-chips {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.suggestion-chip {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.16rem 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #50607A;
  cursor: pointer;
}
.suggestion-chip svg { width: 0.24rem; height: 0.24rem; }

/* ===== Order Card ===== */
.order-card { padding: 0.24rem; }
.order-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.order-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.16rem;
}
.order-summary {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
}
.order-shop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0;
}
.order-shop-name {
  font-size: 0.28rem;
  color: #11192D;
}
.order-shop-meta { font-size: 0.26rem; color: #50607A; }
.order-item {
  display: flex;
  gap: 0.24rem;
  padding: 0.16rem 0;
}
.order-item-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.order-item-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.order-item-name {
  font-size: 0.28rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
}
.order-item-tag {
  display: inline-flex;
  padding: 0.08rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #50607A;
  width: fit-content;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.order-item-price {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.order-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.order-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-qty {
  width: 0.48rem;
  height: 0.48rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.28rem;
  color: #11192D;
}
.order-row {
  display: flex;

const surfaces = {

// ===== LLM Config (Optional) =====

const LLM_CONFIG = {

const FLOWER_IMAGES = {

  { img: FLOWER_IMAGES.flower5, name: '厄瓜多尔粉玫瑰洋桔梗手捧花', meta: '高端定制 · 21朵 · 混搭', tag: '进口花材粉嫩浪漫仪式感满满', price: '42.8', original: '98.0' },

// ===== Dynamic Content Engine =====
const DynamicContent = {
  // Random pick from array
  pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  },

  // Build input context
  getInput() {
    return {
      query: state.query || '',
      recipient: state.recipient || '',
      occasion: this.detectOccasion(state.query),
      season: this.detectSeason(),
      category: this.detectCategory(state.query),
    };
  },

  detectOccasion(q) {
    if (/520|五二零|情人节|七夕/.test(q)) return '520';
    if (/生日|生辰/.test(q)) return '生日';
    if (/母亲节|妈妈节/.test(q)) return '母亲节';
    if (/道歉|对不起|抱歉/.test(q)) return '道歉';
    if (/日常|随便|悦己|自己/.test(q)) return '日常';
    return '';
  },

  detectSeason() {
    const month = new Date().getMonth() + 1;
    if (month >= 3 && month <= 5) return '春季';
    if (month >= 6 && month <= 8) return '夏季';
    if (month >= 9 && month <= 11) return '秋季';
    return '冬季';
  },

  detectCategory(q) {
    const map = { '玫瑰': '玫瑰', '向日葵': '向日葵', '郁金香': '郁金香', '百合': '百合', '康乃馨': '康乃馨', '芍药': '芍药', '满天星': '满天星' };
    for (const k in map) if (q.includes(k)) return map[k];
    return '';
  },

  // ===== Thinking Generation =====
  async generateThinking() {
    const input = this.getInput();
    const r = input.recipient;
    const o = input.occasion;
    const c = input.category;
    const s = input.season;

    // Try LLM first
    if (LLM_CONFIG.apiKey) {
      const systemPrompt = '你是一个鲜花选购专家助手，像易烊千玺一样亲切、专业地帮用户挑花。请根据用户信息生成3段思考文案，每段50-80字，口语化。';
      const userPrompt = `搜索query: ${input.query}, 收花人: ${input.recipient}, 品类: ${input.category}, 季节: ${input.season}, 场合: ${input.occasion}\n要求以JSON返回: {\"step1\":\"分析用户需求...\", \"step2\":\"买手团经验...\", \"step3\":\"挑选平台商品...\"}`;
      try {
        const text = await this.callLLM(systemPrompt, userPrompt);
        if (text) {
          const jsonMatch = text.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.step1 && parsed.step2 && parsed.step3) {
              return { step1: parsed.step1, step2: parsed.step2, step3: parsed.step3 };
            }
          }
        }
      } catch (e) {
        console.error('LLM thinking parse failed:', e);
      }
    }

    // Fallback template engine
    // Step 1: 分析用户需求
    const step1Parts = [];

  async callLLM(systemPrompt, userPrompt) {
    if (!LLM_CONFIG.apiKey) return null;
    try {
      const res = await fetch(LLM_CONFIG.endpoint, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${LLM_CONFIG.apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: LLM_CONFIG.model,
          input: {
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt },
            ],
          },
        }),
      });
      const data = await res.json();
      return data.output?.text || data.output?.choices?.[0]?.message?.content || null;
    } catch (e) {
      console.error('LLM call failed:', e);
      return null;
    }
  },

const homeView = document.getElementById('home-view');
const assistantView = document.getElementById('assistant-view');
const chatArea = document.getElementById('chatArea');
let messagesEl = document.getElementById(surfaces[currentSurface].messagesElId);

// 把某元素顶部对齐到聊天区顶部：只改 chatArea.scrollTop，不用 scrollIntoView，
// 避免在 iframe 内嵌时连带滚动父页面(index.html)导致窜动。
function scrollRowToTop(el) {
  if (!el || !chatArea) return;
  chatArea.scrollTop += el.getBoundingClientRect().top - chatArea.getBoundingClientRect().top;
}

function createRow(className, innerHTML) {
  const row = document.createElement('div');
  row.className = 'message-row ' + className;
  row.innerHTML = innerHTML;
  messagesEl.appendChild(row);
  // 第一条不滚（避免预渲染 welcome 时把 off-screen 容器拽进视窗）
  if (messagesEl.children.length > 1) {
    requestAnimationFrame(() => {
      scrollRowToTop(row);
    });
  }
  return row;
}

function addUserBubble(text) {
  createRow('user', `<div class="user-bubble">${escapeHtml(text)}</div>`);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== View Switching =====
function openAssistant() {
  switchSurface('assistant');
  // 先让 assistant-view 可见但仍处 translateX(100%)，注入 welcome 到 off-screen 容器
  assistantView.classList.add('opening');
  if (messagesEl.children.length === 0) {
    showWelcome();
  }
  // 双 rAF：第 1 帧让浏览器把 off-screen 的 welcome 完成 layout+paint；
  // 第 2 帧再切 .active 触发 transform 过渡 —— 杜绝 welcome 在首页位置闪一帧
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      homeView.classList.add('behind');
      assistantView.classList.add('active');
      assistantView.classList.remove('opening');
    });
  });
}

function closeAssistant() {
  assistantView.classList.remove('active');
  homeView.classList.remove('behind');
  // 等过渡结束再切回首页 state，保持滑动期间助手页 UI 不被首页 state 改写
  setTimeout(() => switchSurface('home'), 320);
}

        </div>
      </div>

  const allGroups = document.querySelectorAll('.thinking-step-group');
  const g1 = allGroups[allGroups.length - 3];
  const g2 = allGroups[allGroups.length - 2];
  const g3 = allGroups[allGroups.length - 1];

  // Dynamic height: measure tallest step group
  const container = g1.parentElement;
  let maxH = 0;
  [g1, g2, g3].forEach(g => {

// ===== Query Classification =====
function isVagueQuery(text) {
  const t = text.trim();
  // 只要有场景信息就不算模糊query
  if (/送女友|送妈妈|送长辈|送朋友|送闺蜜|自己欣赏|送伴侣|居家|悦己|好友|见面/.test(t)) return false;
  // 只要有品类信息就不算模糊query
  if (/玫瑰|向日葵|郁金香|牡丹|康乃馨|百合|满天星/.test(t)) return false;
  // 只有包含核心模糊意图词才算模糊
  return /鲜花|买花|送花/.test(t);
}

function isCategoryQuery(text) {
  return /(玫瑰|向日葵|郁金香|牡丹|康乃馨|百合|满天星)/.test(text.trim());
}

// ===== Interaction Handlers =====
function isScenarioQuery(text) {
  return /送女友|送妈妈|送长辈|送朋友|送闺蜜|自己欣赏|送伴侣|居家|悦己|好友/.test(text);
}

function routeQuery(text) {
  state.query = text;
  if (text.includes('祝福语')) {
    showOrderCard();
  } else if (!state.addressShown) {
    state.pendingQuery = text;
    showAddressCard();
  } else {
    if (isVagueQuery(text)) {
      showClarifyCard();
    } else if (isCategoryQuery(text) || isScenarioQuery(text)) {
      (async () => { await showThinkingCard(); })();
    } else {
      (async () => { await showThinkingCard(); })();
    }
  }
}

function selectScenario(text) {
  state.recipient = text;
  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}

function hideAllChips() {
  document.querySelectorAll('.suggestion-chips').forEach(el => {
    el.style.display = 'none';
  });
}

function updateBlessingDisplay(blessing) {
  const orderEl = document.getElementById('order-blessing');
  if (orderEl) {
    orderEl.textContent = blessing;
    orderEl.classList.remove('muted');
  }
  const detailEl = document.getElementById('detail-blessing');
  if (detailEl) {
    detailEl.textContent = blessing;
    detailEl.classList.remove('muted');
  }
}

function sendQuick(text) {
  const isChip = typeof event !== 'undefined' && event && event.target && event.target.closest('.suggestion-chip');

  if (isChip) {
    hideAllChips();

    if (text.includes('加个祝福语')) {
      const blessing = text.replace('加个祝福语，', '').replace(/[""]/g, '').trim();
      state.blessing = blessing;
      const chip = event.target.closest('.suggestion-chip');
      const orderCard = chip && chip.closest('.order-card');
      if (orderCard) {
        const blessingEl = orderCard.querySelector('#order-blessing');
        if (blessingEl) {
          blessingEl.textContent = blessing;
          blessingEl.classList.remove('muted');
        }
      } else {
        updateBlessingDisplay(blessing);
      }
      return;
    }
  }

  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}

function handleHomeInputClick() {
  const text = prompt('请输入您想发送的消息：', '帮我点个鲜花');
  if (text && text.trim()) {
    const trimmed = text.trim();
    switchSurface('home');
    addUserBubble(trimmed);
    setTimeout(() => {
      routeQuery(trimmed);
    }, 300);
  }
}

function handleInputClick() {
  const text = prompt('请输入您想发送的消息：', '帮我点个鲜花');

    const trimmed = text.trim();
    addUserBubble(trimmed);
    setTimeout(() => {
      routeQuery(trimmed);
    }, 300);
  }
}

    }
  }, 300);
}

}
