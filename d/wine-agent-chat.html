<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>闪购千问</title>
<style>
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Bd.ttf") format("truetype");
  font-weight: 700;
}
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Rg.ttf") format("truetype");
  font-weight: 400;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 13.333vw; }
body {
  font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #F3F6F8;
  height: 100vh;
  overflow: hidden;
}
.app {
  width: 100%;
  max-width: 7.5rem;
  margin: 0 auto;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== Views ===== */
.view {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
}
.home-view {
  z-index: 1;
  background: #F3F6F8;
}
.assistant-view {
  z-index: 2;
  background: #F3F6F8;
  transform: translateY(100%);
}
.assistant-view.active {
  transform: translateY(0);
}

/* ===== Nav Bar ===== */
.nav-bar {
  height: 1.76rem;
  background: #FFFFFF;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.status-bar { height: 0.88rem; }
.nav-content {
  height: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.2rem;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 0.16rem;
}
.nav-icon {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.nav-icon svg { width: 0.4rem; height: 0.373rem; }
.nav-title {
  font-size: 0.36rem;
  font-weight: 500;
  color: #11192D;
}
.nav-right {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-right svg { width: 0.4rem; height: 0.4rem; }

/* ===== Home View ===== */
.home-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.home-content::-webkit-scrollbar { display: none; }
.home-bottom {
  background: #FFFFFF;
  padding: 0.18rem 0.24rem 0.56rem;
  flex-shrink: 0;
  border-top: 0.01rem solid #F3F6F8;
}
.home-toolbar {
  display: flex;
  gap: 0.14rem;
  margin-bottom: 0.18rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.home-toolbar::-webkit-scrollbar { display: none; }
.home-toolbar-item {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0.24rem;
  border: 0.015rem solid #E5E8EC;
  border-radius: 0.12rem;
  font-size: 0.26rem;
  color: #11192D;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
  background: #FFFFFF;
}
.home-toolbar-item img { width: 0.32rem; height: 0.32rem; }
.home-input-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0.16rem;
  border: 0.015rem solid rgba(229,232,236,0.8);
  border-radius: 0.2rem;
  height: 0.92rem;
  cursor: pointer;
}
.home-input-placeholder {
  font-size: 0.28rem;
  color: #7C889C;
}
.home-input-hint {
  text-align: center;
  font-size: 0.18rem;
  color: #CACFD7;
  margin-top: 0.12rem;
}

/* ===== Assistant Chat Area ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.32rem 0.32rem 0.24rem;
  display: flex;
  flex-direction: column;
  gap: 0.52rem;
}
.chat-area::-webkit-scrollbar { display: none; }

/* ===== Messages ===== */
.message-row {
  display: flex;
  width: 100%;
  margin-bottom: 0.52rem;
}
.message-row:last-child { margin-bottom: 0; }
.message-row.user { justify-content: flex-end; }
.message-row.assistant { justify-content: flex-start; }

.user-bubble {
  max-width: 5rem;
  padding: 0.16rem 0.32rem;
  background: #FFE6D7;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.48rem;
  word-break: break-all;
}

.assistant-card {
  width: 100%;
  max-width: 6.86rem;
  background: #FFFFFF;
  border-radius: 0.12rem;
  overflow: hidden;
}

/* ===== Welcome Card ===== */
.welcome-card {
  background: linear-gradient(180deg, #F9FBFF 0%, #FFFFFF 100%);
  padding: 0.4rem 0.24rem 0.24rem;
  border-radius: 0.12rem;
}
.welcome-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.32rem;
}
.welcome-badge {
  display: inline-block;
  padding: 0.04rem 0.14rem;
  background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%);
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #111111;
  margin-bottom: 0.08rem;
}
.welcome-title {
  font-size: 0.48rem;
  font-weight: 500;
  color: #111111;
  line-height: 0.67rem;
}
.welcome-subtitle {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
}
.welcome-mascot {
  width: 1.88rem;
  height: 2.04rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.scenario-list {
  display: flex;
  flex-direction: column;
  gap: 0.16rem;
}
.scenario-item {
  height: 1.51rem;
  border-radius: 0.16rem;
  padding: 0.32rem 0.4rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
}
.scenario-item:active { transform: scale(0.98); }
.scenario-item:nth-child(1) { background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%); }
.scenario-item:nth-child(2) { background: linear-gradient(270deg, #FFFEF8 0%, #FFF5F5 100%); }
.scenario-item:nth-child(3) { background: linear-gradient(270deg, #FDFFF8 0%, #FDFFEC 100%); }
.scenario-title {
  font-size: 0.32rem;
  color: #111111;
  line-height: 0.45rem;
  font-weight: 500;
}
.scenario-desc {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
  line-height: 0.34rem;
}

/* ===== Address Card ===== */
.address-card { padding: 0.24rem; }
.address-text {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.16rem;
}
.address-current {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0;
  margin-bottom: 0.16rem;
}
.address-current svg { width: 0.32rem; height: 0.32rem; flex-shrink: 0; }
.address-current span {
  font-size: 0.28rem;
  color: #11192D;
}
.address-actions {
  display: flex;
  gap: 0.16rem;
}
.address-btn {
  flex: 1;
  height: 0.8rem;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.3rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
}
.address-btn.secondary {
  background: #F3F6F8;
  color: #50607A;
}
.address-btn.primary {
  background: #FF6200;
  color: #FFFFFF;
}

/* ===== Clarify Card ===== */
.clarify-card { padding: 0.24rem; }
.clarify-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.clarify-header span {
  font-size: 0.28rem;
  color: #50607A;
}
.clarify-header svg { width: 0.28rem; height: 0.28rem; }
.clarify-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.clarify-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.24rem;
}
.clarify-question {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.16rem;
}
.clarify-options {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
}
.clarify-option {
  display: flex;
  align-items: center;
  gap: 0.16rem;
  padding: 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  cursor: pointer;
  background: #FFFFFF;
  transition: all 0.15s;
}
.clarify-option:active { background: #F9FBFF; }
.option-checkbox {
  width: 0.32rem;
  height: 0.32rem;
  border: 0.035rem solid #CACFD7;
  border-radius: 50%;
  flex-shrink: 0;
}
.option-text {
  font-size: 0.28rem;
  color: #11192D;
}

/* ===== Thinking Card ===== */
.thinking-card { padding: 0.24rem; position: relative; }
.thinking-steps-container {
  position: relative;
}
.thinking-step-group {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transform: translateY(0.2rem);
  transition: all 0.5s ease;
}
.thinking-step-group.visible {
  opacity: 1;
  transform: translateY(0);
}
.thinking-step-group .thinking-step {
  display: flex;
  align-items: flex-start;
  gap: 0.16rem;
  margin-bottom: 0.08rem;
}
.thinking-step-group .thinking-step svg { width: 0.3rem; height: 0.3rem; flex-shrink: 0; margin-top: 0.02rem; }
.thinking-step-group .thinking-step-title {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.36rem;
}
.thinking-step-group .thinking-step-desc {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.44rem;
  margin-left: 0.46rem;
}

/* ===== Listcard (攻略型结果) ===== */
.listcard { padding: 0.24rem; }
.listcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.listcard-header span { font-size: 0.28rem; color: #50607A; }
.listcard-header svg { width: 0.28rem; height: 0.28rem; }
.listcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.listcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.listcard-desc b {
  font-size: 0.3rem;
  display: inline-block;
  margin-top: 0.04rem;
}
.listcard-gradient {
  position: absolute;
  top: 0; right: 0;
  width: 1.56rem;
  height: 1.69rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
}
.list-product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
  display: flex;
  gap: 0.24rem;
}
.list-product-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.list-product-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
}
.list-product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-top: 0.04rem;
  margin-bottom: 0.08rem;
}
.list-product-meta {
  font-size: 0.24rem;
  color: #50607A;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.16rem;
}
.list-product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.04rem;
}
.list-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.list-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.list-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
}

/* ===== Bigcard ===== */
.bigcard { padding: 0.24rem; }
.bigcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.bigcard-header span { font-size: 0.28rem; color: #50607A; }
.bigcard-header svg { width: 0.28rem; height: 0.28rem; }
.bigcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.bigcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.product-cards-scroll {
  display: flex;
  gap: 0.16rem;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -0.24rem;
  padding: 0 0.24rem;
}
.product-cards-scroll::-webkit-scrollbar { display: none; }
.product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.24rem;
  margin-bottom: 0.16rem;
  width: 5.92rem;
  flex-shrink: 0;
}
.product-image-wrap {
  position: relative;
  margin-bottom: 0.12rem;
}
.product-image-overlay {
  position: absolute;
  bottom: 0.16rem;
  left: 0.16rem;
  background: rgba(14, 17, 25, 0.5);
  border-radius: 0.08rem;
  padding: 0.06rem 0.12rem;
  font-size: 0.22rem;
  color: #FFFFFF;
}
.shop-header {
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
  margin-bottom: 0.12rem;
}
.shop-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  white-space: nowrap;
}
.shop-meta {
  font-size: 0.26rem;
  color: #50607A;
  white-space: nowrap;
}
.product-image {
  width: 100%;
  height: 4.08rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127231384010781/183107002341513/e4b133ee9ff9f04420d7c736fc131a86.webp);
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  margin-bottom: 0.12rem;
}
.product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-bottom: 0.03rem;
}
.product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  margin-top: 0.08rem;
  margin-bottom: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.price-current {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.price-prefix {
  font-size: 0.26rem;
  font-weight: 500;
  color: #FF6200;
  margin-bottom: 0.04rem;
  transform: translateY(2px);
}
.price-unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.price-value {
  font-size: 0.4rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
  line-height: 0.42rem;
}
.price-original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
  transform: translateY(2px);
}
.select-btn {
  width: 100%;
  height: 0.8rem;
  background: #FF6200;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 0.3rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  margin-top: 0.12rem;
}
.bigcard-footer {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-top: 0.16rem;
}
.action-bar {
  display: flex;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.action-btn {
  width: 0.6rem;
  height: 0.6rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  cursor: pointer;
}
.suggestion-chips {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.suggestion-chip {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.16rem 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #50607A;
  cursor: pointer;
}
.suggestion-chip svg { width: 0.24rem; height: 0.24rem; }

/* ===== Order Card ===== */
.order-card { padding: 0.24rem; }
.order-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.order-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.16rem;
}
.order-summary {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
}
.order-shop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0;
}
.order-shop-name {
  font-size: 0.28rem;
  color: #11192D;
}
.order-shop-meta { font-size: 0.26rem; color: #50607A; }
.order-item {
  display: flex;
  gap: 0.24rem;
  padding: 0.16rem 0;
}
.order-item-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.order-item-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.order-item-name {
  font-size: 0.28rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
}
.order-item-tag {
  display: inline-flex;
  padding: 0.08rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #50607A;
  width: fit-content;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.order-item-price {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.order-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.order-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-qty {
  width: 0.48rem;
  height: 0.48rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.28rem;
  color: #11192D;
}
.order-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.2rem 0;
  border-top: 0.01rem solid #F3F6F8;
}
.order-row-label {
  font-size: 0.26rem;
  color: #11192D;
}
.order-row-value {
  font-size: 0.26rem;
  color: #11192D;
  display: flex;
  align-items: center;
  gap: 0.04rem;
}
.order-row-value.muted { color: #7C889C; }
.order-divider {
  height: 0.01rem;
  background: #11192D;

// ===== LLM Config (Optional) =====

const FLOWER_IMAGES = {

// ===== Product Catalog =====

  { img: FLOWER_IMAGES.flower2, name: '迷失海岸 IPA 精酿啤酒组合装', meta: '美式精酿 · 330ml × 6 · 6.5%', tag: '下班小酌首选·果香浓郁回味甘爽', price: '89', original: '138' },
  { img: FLOWER_IMAGES.flower3, name: '五粮液 52度经典装·双瓶礼盒', meta: '宜宾产区 · 500ml × 2 · 52%', tag: '国酒经典·宴席送礼不踩雷', price: '1298', original: '1598' },
  { img: FLOWER_IMAGES.flower4, name: '山崎 12 年单一麦芽威士忌', meta: '日本山崎 · 700ml · 43%', tag: '日威入门天花板·花香果味层次丰富', price: '899', original: '1280' },
  { img: FLOWER_IMAGES.flower5, name: '酩悦香槟 Moet 经典白中白', meta: '法国香槟区 · 750ml · 12%', tag: '约会仪式感拉满·气泡细腻优雅', price: '328', original: '458' },
  { img: FLOWER_IMAGES.flower6, name: '拉菲传奇波尔多干红·礼袋装', meta: '法国波尔多 · 750ml · 13.5%', tag: '法国名庄入门款·果香馥郁结构平衡', price: '198', original: '298' },
];

const BIGCARD_PRODUCTS = {
  big1: { img: FLOWER_IMAGES.flower1, name: '奔富 BIN389 赤霞珠干红·双支礼盒', tag: '中澳经典硬通货·朋友聚会首选', price: '398', original: '598' },
  big2: { img: FLOWER_IMAGES.flower4, name: '山崎 12 年单一麦芽威士忌', tag: '日威入门天花板·独酌品鉴之选', price: '899', original: '1280' },
};

// ===== Dynamic Content Engine =====
const DynamicContent = {
  // Random pick from array
  pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  },

  // Build input context
  getInput() {
    return {
      query: state.query || '',
      recipient: state.recipient || '',
      occasion: this.detectOccasion(state.query),
      season: this.detectSeason(),
      category: this.detectCategory(state.query),
    };
  },

  detectOccasion(q) {
    if (/送礼|送领导|客户|商务|答谢|拜访/.test(q)) return '商务送礼';
    if (/约会|情人节|520|七夕|纪念日|女友|老婆/.test(q)) return '约会';
    if (/年夜饭|家宴|中秋|春节|婚宴|寿宴|生日/.test(q)) return '宴请';
    if (/下班|撸串|火锅|烧烤|小酌|兄弟|哥们/.test(q)) return '小酌';
    if (/自己|独酌|一个人|周末|在家|解压/.test(q)) return '独酌';
    if (/收藏|品鉴|老酒|投资|限定/.test(q)) return '收藏';
    return '';
  },

  detectSeason() {
    const month = new Date().getMonth() + 1;
    if (month >= 3 && month <= 5) return '春季';
    if (month >= 6 && month <= 8) return '夏季';
    if (month >= 9 && month <= 11) return '秋季';
    return '冬季';
  },

  detectCategory(q) {
    const map = { '茅台':'白酒','五粮液':'白酒','国窖':'白酒','剑南春':'白酒','白酒':'白酒','拉菲':'红酒','奔富':'红酒','红酒':'红酒','干红':'红酒','波尔多':'红酒','山崎':'威士忌','响':'威士忌','白州':'威士忌','威士忌':'威士忌','单一麦芽':'威士忌','精酿':'精酿','IPA':'精酿','百威':'啤酒','青岛':'啤酒','啤酒':'啤酒','1664':'啤酒','香槟':'起泡酒','起泡':'起泡酒','清酒':'清酒' };
    for (const k in map) if (q.includes(k)) return map[k];
    return '';
  },

  // ===== Thinking Generation =====
  async generateThinking() {
    const input = this.getInput();
    const r = input.recipient;
    const o = input.occasion;
    const c = input.category;
    const s = input.season;

    // Try LLM first
    if (LLM_CONFIG.apiKey) {
      const systemPrompt = '你是一个选酒专家助手，像懂行的侍酒师一样亲切、专业地帮用户挑酒。请根据用户信息生成3段思考文案，每段50-80字，口语化。';
      const userPrompt = `搜索query: ${input.query}, 饮酒场合: ${input.recipient}, 酒类偏好: ${input.category}, 季节: ${input.season}, 场合: ${input.occasion}\n要求以JSON返回: {\"step1\":\"分析用户需求...\", \"step2\":\"买手团经验...\", \"step3\":\"挑选平台商品...\"}`;
      try {
        const text = await this.callLLM(systemPrompt, userPrompt);
        if (text) {
          const jsonMatch = text.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.step1 && parsed.step2 && parsed.step3) {
              return { step1: parsed.step1, step2: parsed.step2, step3: parsed.step3 };
            }
          }
        }
      } catch (e) {
        console.error('LLM thinking parse failed:', e);
      }
    }

    // Fallback template engine
    // Step 1: 分析用户需求
    const step1Parts = [];
    if (r.includes('送礼') || r.includes('送领导') || r.includes('商务')) {

  // ===== Listcard Sections Generation =====
  async generateListcardSections() {
    const input = this.getInput();
    const r = input.recipient;
    const o = input.occasion;
    const c = input.category;
    const s = input.season;

    // Try LLM first
    if (LLM_CONFIG.apiKey) {
      const systemPrompt = '你是一个选酒专家助手，像懂行的侍酒师一样亲切、专业地帮用户挑酒。请生成2-3个酒款推荐板块的标题和描述，每个板块包含icon（emoji）、title（标题）、desc（描述，80-120字，口语化）。';
      const userPrompt = `搜索query: ${input.query}, 饮酒场合: ${input.recipient}, 酒类偏好: ${input.category}, 季节: ${input.season}, 场合: ${input.occasion}\n要求以JSON数组返回，例如: [{\"icon\":\"🔥\",\"title\":\"小红书爆款\",\"desc\":\"...\"},{\"icon\":\"📈\",\"title\":\"时令新品\",\"desc\":\"...\"}]`;
      try {
        const text = await this.callLLM(systemPrompt, userPrompt);
        if (text) {
          const jsonMatch = text.match(/\[[\s\S]*\]/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].icon && parsed[0].title && parsed[0].desc) {
              return parsed.slice(0, 3);
            }
          }
        }
      } catch (e) {
        console.error('LLM listcard parse failed:', e);
      }
    }

    // Fallback template engine
    const sections = [];

    // Pool of available sections
    const pool = [
      {
        id: 'trending',
        icon: '🔥',
        title: '热销爆款',
        desc: () => {
          if (r.includes('送礼') || r.includes('商务') || r.includes('送领导')) return '商务送礼圈里这几款酒出场率极高，品牌认知度强、包装大气、不用担心踩雷。领导客户收到都觉得有面子~';
          if (r.includes('小酌') || r.includes('朋友') || r.includes('下班')) return '下班小酌群里这几款复购率最高，价格亲民、口味大众、6 瓶装正好人手一瓶。微醺不上头，第二天不耽误事~';
          if (r.includes('约会') || r.includes('纪念日')) return '约会场景中这几款酒颜值和口碑兼顾，开瓶仪式感十足。气泡翻涌或红酒倒杯的瞬间，氛围自然就来了~';
          if (r.includes('独酌') || r.includes('自己')) return '独酌圈好评如潮的几款，风味层次丰富、适合安静品味。一个人的时光配上一杯好酒，解压又治愈~';
          return '平台近期销量最高的几款酒，覆盖红酒、白酒、精酿各个品类。大家都在喝的准没错~';
        },
      },
      {
        id: 'sommelier',
        icon: '🍷',
        title: '侍酒师推荐',
        desc: () => {
          if (r.includes('送礼') || r.includes('商务')) return '资深侍酒师为商务场景精选的酒单，兼顾品牌辨识度和性价比。这几款送出去体面又不心疼钱包~';
          if (r.includes('约会') || r.includes('纪念日')) return '侍酒师私藏的约会酒单，每一款都经过"氛围感"和"易饮度"双重考核。就算不常喝酒的另一半也会喜欢~';
          if (c === '威士忌') return '威士忌入门到进阶的经典路线：从花果调日威到泥煤艾雷岛，侍酒师按风味谱系为你排好了顺序~';
          if (c === '红酒') return '红酒的世界很大，侍酒师帮你缩小范围：这几款都是产区经典、性价比之选，盲选不会错~';
          return '侍酒师从上千款酒中精选出的当季推荐，每款都有明确的饮用场景建议。跟着选就对了~';
        },
      },
      {
        id: 'value',
        icon: '💰',
        title: '高性价比之选',
        desc: () => {
          if (r.includes('小酌') || r.includes('朋友')) return '聚会不用花大钱也能喝好的。这几款百元以内口碑爆棚，人均不到一杯奶茶的钱，体验却超出预期~';
          return '好喝不贵的宝藏酒款，品质远超价格给人的预期。日常囤货或者尝鲜都很合适~';
        },
      },
      {
        id: 'express',
        icon: '⚡',
        title: '附近45分钟达',
        desc: () => '附近这几家酒铺支持 45 分钟极速送达，冷链保鲜、原箱配送。临时起意想喝酒也不用跑腿，下单就等着收~',
      },
      {
        id: 'category',
        icon: c === '白酒' ? '🏮' : c === '红酒' ? '🍷' : c === '威士忌' ? '🥃' : c === '精酿' ? '🍺' : c === '起泡酒' ? '🥂' : '🍶',
        title: c ? `${c}精选` : '当季推荐',
        desc: () => {
          if (c === '白酒') return '白酒专区精选茅台、五粮液、国窖等名牌，从自饮到送礼全覆盖。每款都有明确的场景建议和适饮温度~';
          if (c === '红酒') return '红酒专区从旧世界法国到新世界澳洲，经典产区一网打尽。按口味偏好（饱满/柔和/果味）分类推荐~';
          if (c === '威士忌') return '威士忌专区日威、苏威、美威应有尽有，从入门到收藏级别。按风味光谱（花果/蜜糖/泥煤/雪莉）分类导航~';
          if (c === '精酿') return '精酿专区 IPA、世涛、小麦、酸啤各种风格齐全。选择困难的话按苦度/度数筛选最快~';
          if (c === '起泡酒') return '起泡酒专区从酩悦到西班牙 Cava，气泡细腻度和甜度一目了然。约会、庆祝、纯饮都有推荐~';
          return '当季侍酒师精选酒单，根据天气和饮酒趋势实时更新。夏天冰爽、冬天暖身，四季都有好酒陪~';
        },
      },
    ];

    // Select relevant sections
    sections.push(pool[0]); // 热销爆款 always first
    sections.push(pool[1]); // 侍酒师推荐 always second

    if (o === '商务送礼' || o === '宴请') sections.push(pool[3]); // 附近45分钟达
    if (c) sections.push(pool[4]); // category section if specified
    else if (!r.includes('送礼') && !r.includes('商务')) sections.push(pool[2]); // 性价比之选 for casual

    // Ensure unique emojis
    const usedEmojis = new Set();
    return sections.filter(sec => {
      if (usedEmojis.has(sec.icon)) return false;
      usedEmojis.add(sec.icon);
      return true;
    }).map(sec => ({
      icon: sec.icon,
      title: sec.title,
      desc: typeof sec.desc === 'function' ? sec.desc() : sec.desc,
    }));
  },

  async callLLM(systemPrompt, userPrompt) {
    if (!LLM_CONFIG.apiKey) return null;
    try {
      const res = await fetch(LLM_CONFIG.endpoint, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${LLM_CONFIG.apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: LLM_CONFIG.model,
          input: {
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt },
            ],
          },
        }),
      });
      const data = await res.json();
      return data.output?.text || data.output?.choices?.[0]?.message?.content || null;
    } catch (e) {
      console.error('LLM call failed:', e);
      return null;

const homeView = document.getElementById('home-view');
const assistantView = document.getElementById('assistant-view');
const chatArea = document.getElementById('chatArea');
const messagesEl = document.getElementById('messages');

function createRow(className, innerHTML) {
  const row = document.createElement('div');
  row.className = 'message-row ' + className;
  row.innerHTML = innerHTML;
  messagesEl.appendChild(row);
  requestAnimationFrame(() => {
    row.scrollIntoView({ block: 'start', behavior: 'auto' });
  });
  return row;
}

function addUserBubble(text) {
  createRow('user', `<div class="user-bubble">${escapeHtml(text)}</div>`);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

          </div>
          <div class="thinking-step-desc">${thinking.step3}</div>
        </div>
      </div>
    </div>
  `;
  createRow('assistant', html);

  const allGroups = document.querySelectorAll('.thinking-step-group');
  const g1 = allGroups[allGroups.length - 3];
  const g2 = allGroups[allGroups.length - 2];
  const g3 = allGroups[allGroups.length - 1];

  // Dynamic height: measure tallest step group
  const container = g1.parentElement;
  let maxH = 0;
  [g1, g2, g3].forEach(g => {
    const h = g.getBoundingClientRect().height;

      (async () => { await showBigcard(); })();

      (async () => { await showListcard(); })();
    }
  }, 4000);
}

// ===== Query Classification =====
function isVagueQuery(text) {
  const t = text.trim();
  // 只要有场景信息就不算模糊query
  if (/送礼|送领导|客户|商务|约会|纪念日|宴请|家宴|小酌|下班|独酌|自己喝|朋友|兄弟|收藏|品鉴/.test(t)) return false;
  // 只要有品类信息就不算模糊query
  if (/茅台|五粮液|国窖|剑南春|白酒|拉菲|奔富|红酒|干红|波尔多|山崎|响|白州|威士忌|单一麦芽|精酿|IPA|百威|青岛|啤酒|1664|香槟|起泡|清酒/.test(t)) return false;
  // 只有包含核心模糊意图词才算模糊
  return /酒|喝酒|买酒|来瓶|来一瓶/.test(t);
}

function isCategoryQuery(text) {
  return /(茅台|五粮液|国窖|剑南春|白酒|拉菲|奔富|红酒|干红|波尔多|山崎|响|白州|威士忌|单一麦芽|精酿|IPA|百威|青岛|啤酒|1664|香槟|起泡|清酒)/.test(text.trim());
}

// ===== Interaction Handlers =====
function isScenarioQuery(text) {
  return /送礼|送领导|客户|商务|约会|纪念日|宴请|家宴|小酌|下班|独酌|自己喝|朋友|兄弟|收藏|品鉴/.test(text);
}

function routeQuery(text) {
  state.query = text;
  if (text.includes('备注')) {
    showOrderCard();
  } else if (!state.addressShown) {
    state.pendingQuery = text;
    showAddressCard();
  } else {
    if (isVagueQuery(text)) {
      showClarifyCard();
    } else if (isCategoryQuery(text) || isScenarioQuery(text)) {
      (async () => { await showThinkingCard(); })();
    } else {
      (async () => { await showThinkingCard(); })();
    }
  }
}

function selectScenario(text) {
  state.recipient = text;
  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}

function hideAllChips() {
  document.querySelectorAll('.suggestion-chips').forEach(el => {
    el.style.display = 'none';
  });
}

function updateBlessingDisplay(blessing) {
  const orderEl = document.getElementById('order-note');
  if (orderEl) {
    orderEl.textContent = blessing;
    orderEl.classList.remove('muted');
  }
  const detailEl = document.getElementById('detail-note');
  if (detailEl) {
    detailEl.textContent = blessing;
    detailEl.classList.remove('muted');
  }
}

function sendQuick(text) {
  const isChip = typeof event !== 'undefined' && event && event.target && event.target.closest('.suggestion-chip');

  if (isChip) {
    hideAllChips();

    if (text.includes('加个备注')) {
      const blessing = text.replace('加个备注，', '').replace(/[""]/g, '').trim();
      state.blessing = blessing;
      const chip = event.target.closest('.suggestion-chip');
      const orderCard = chip && chip.closest('.order-card');
      if (orderCard) {
        const blessingEl = orderCard.querySelector('#order-note');
        if (blessingEl) {
          blessingEl.textContent = blessing;
          blessingEl.classList.remove('muted');
        }
      } else {
        updateBlessingDisplay(blessing);
      }
      return;
    }
  }

  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}

  const text = prompt('请输入您想发送的消息：', '帮我选瓶酒');

}
