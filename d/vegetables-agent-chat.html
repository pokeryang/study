<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>闪购千问</title>
<style>
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Bd.ttf") format("truetype");
  font-weight: 700;
}
@font-face {
  font-family: "Alibaba Sans 102";
  src: url("https://g.alicdn.com/taobaodesign/alibaba-sans-102-taobao-font/0.0.1/AlibabaSans102_v1_TaoBao-Rg.ttf") format("truetype");
  font-weight: 400;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 13.333vw; }
body {
  font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #F3F6F8;
  height: 100vh;
  overflow: hidden;
}
.app {
  width: 100%;
  max-width: 7.5rem;
  margin: 0 auto;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== Views ===== */
.view {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
}
.home-view {
  z-index: 1;
  background: #F3F6F8;
}
.assistant-view {
  z-index: 2;
  background: #F3F6F8;
  transform: translateY(100%);
}
.assistant-view.active {
  transform: translateY(0);
}

/* ===== Nav Bar ===== */
.nav-bar {
  height: 1.76rem;
  background: #FFFFFF;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.status-bar { height: 0.88rem; }
.nav-content {
  height: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.2rem;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 0.16rem;
}
.nav-icon {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.nav-icon svg { width: 0.4rem; height: 0.373rem; }
.nav-title {
  font-size: 0.36rem;
  font-weight: 500;
  color: #11192D;
}
.nav-right {
  width: 0.56rem;
  height: 0.56rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-right svg { width: 0.4rem; height: 0.4rem; }

/* ===== Home View ===== */
.home-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.home-content::-webkit-scrollbar { display: none; }
.home-bottom {
  background: #FFFFFF;
  padding: 0.18rem 0.24rem 0.56rem;
  flex-shrink: 0;
  border-top: 0.01rem solid #F3F6F8;
}
.home-toolbar {
  display: flex;
  gap: 0.14rem;
  margin-bottom: 0.18rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.home-toolbar::-webkit-scrollbar { display: none; }
.home-toolbar-item {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0.24rem;
  border: 0.015rem solid #E5E8EC;
  border-radius: 0.12rem;
  font-size: 0.26rem;
  color: #11192D;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
  background: #FFFFFF;
}
.home-toolbar-item img { width: 0.32rem; height: 0.32rem; }
.home-input-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0.16rem;
  border: 0.015rem solid rgba(229,232,236,0.8);
  border-radius: 0.2rem;
  height: 0.92rem;
  cursor: pointer;
}
.home-input-placeholder {
  font-size: 0.28rem;
  color: #7C889C;
}
.home-input-hint {
  text-align: center;
  font-size: 0.18rem;
  color: #CACFD7;
  margin-top: 0.12rem;
}

/* ===== Assistant Chat Area ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.32rem 0.32rem 0.24rem;
  display: flex;
  flex-direction: column;
  gap: 0.52rem;
}
.chat-area::-webkit-scrollbar { display: none; }

/* ===== Messages ===== */
.message-row {
  display: flex;
  width: 100%;
  margin-bottom: 0.52rem;
}
.message-row:last-child { margin-bottom: 0; }
.message-row.user { justify-content: flex-end; }
.message-row.assistant { justify-content: flex-start; }

.user-bubble {
  max-width: 5rem;
  padding: 0.16rem 0.32rem;
  background: #FFE6D7;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.48rem;
  word-break: break-all;
}

.assistant-card {
  width: 100%;
  max-width: 6.86rem;
  background: #FFFFFF;
  border-radius: 0.12rem;
  overflow: hidden;
}

/* ===== Welcome Card ===== */
.welcome-card {
  background: linear-gradient(180deg, #F9FBFF 0%, #FFFFFF 100%);
  padding: 0.4rem 0.24rem 0.24rem;
  border-radius: 0.12rem;
}
.welcome-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.32rem;
}
.welcome-badge {
  display: inline-block;
  padding: 0.04rem 0.14rem;
  background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%);
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #111111;
  margin-bottom: 0.08rem;
}
.welcome-title {
  font-size: 0.48rem;
  font-weight: 500;
  color: #111111;
  line-height: 0.67rem;
}
.welcome-subtitle {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
}
.welcome-mascot {
  width: 1.88rem;
  height: 2.04rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.scenario-list {
  display: flex;
  flex-direction: column;
  gap: 0.16rem;
}
.scenario-item {
  height: 1.51rem;
  border-radius: 0.16rem;
  padding: 0.32rem 0.4rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
}
.scenario-item:active { transform: scale(0.98); }
.scenario-item:nth-child(1) { background: linear-gradient(270deg, #FBF8FF 0%, #ECF3FF 100%); }
.scenario-item:nth-child(2) { background: linear-gradient(270deg, #FFFEF8 0%, #FFF5F5 100%); }
.scenario-item:nth-child(3) { background: linear-gradient(270deg, #FDFFF8 0%, #FDFFEC 100%); }
.scenario-title {
  font-size: 0.32rem;
  color: #111111;
  line-height: 0.45rem;
  font-weight: 500;
}
.scenario-desc {
  font-size: 0.24rem;
  color: #666666;
  margin-top: 0.08rem;
  line-height: 0.34rem;
}

/* ===== Address Card ===== */
.address-card { padding: 0.24rem; }
.address-text {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.16rem;
}
.address-current {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.12rem 0;
  margin-bottom: 0.16rem;
}
.address-current svg { width: 0.32rem; height: 0.32rem; flex-shrink: 0; }
.address-current span {
  font-size: 0.28rem;
  color: #11192D;
}
.address-actions {
  display: flex;
  gap: 0.16rem;
}
.address-btn {
  flex: 1;
  height: 0.8rem;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.3rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
}
.address-btn.secondary {
  background: #F3F6F8;
  color: #50607A;
}
.address-btn.primary {
  background: #FF6200;
  color: #FFFFFF;
}

/* ===== Clarify Card ===== */
.clarify-card { padding: 0.24rem; }
.clarify-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.clarify-header span {
  font-size: 0.28rem;
  color: #50607A;
}
.clarify-header svg { width: 0.28rem; height: 0.28rem; }
.clarify-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.clarify-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.24rem;
}
.clarify-question {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.16rem;
}
.clarify-options {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
}
.clarify-option {
  display: flex;
  align-items: center;
  gap: 0.16rem;
  padding: 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  cursor: pointer;
  background: #FFFFFF;
  transition: all 0.15s;
}
.clarify-option:active { background: #F9FBFF; }
.option-checkbox {
  width: 0.32rem;
  height: 0.32rem;
  border: 0.035rem solid #CACFD7;
  border-radius: 50%;
  flex-shrink: 0;
}
.option-text {
  font-size: 0.28rem;
  color: #11192D;
}

/* ===== Thinking Card ===== */
.thinking-card { padding: 0.24rem; position: relative; }
.thinking-steps-container {
  position: relative;
}
.thinking-step-group {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transform: translateY(0.2rem);
  transition: all 0.5s ease;
}
.thinking-step-group.visible {
  opacity: 1;
  transform: translateY(0);
}
.thinking-step-group .thinking-step {
  display: flex;
  align-items: flex-start;
  gap: 0.16rem;
  margin-bottom: 0.08rem;
}
.thinking-step-group .thinking-step svg { width: 0.3rem; height: 0.3rem; flex-shrink: 0; margin-top: 0.02rem; }
.thinking-step-group .thinking-step-title {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.36rem;
}
.thinking-step-group .thinking-step-desc {
  font-size: 0.28rem;
  color: #50607A;
  line-height: 0.44rem;
  margin-left: 0.46rem;
}

/* ===== Listcard (攻略型结果) ===== */
.listcard { padding: 0.24rem; }
.listcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.listcard-header span { font-size: 0.28rem; color: #50607A; }
.listcard-header svg { width: 0.28rem; height: 0.28rem; }
.listcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.listcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.listcard-desc b {
  font-size: 0.3rem;
  display: inline-block;
  margin-top: 0.04rem;
}
.listcard-gradient {
  position: absolute;
  top: 0; right: 0;
  width: 1.56rem;
  height: 1.69rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127934472087409/127934472087410/2281a8c8023980ff9dbe90a3229c174c.png);
  background-size: cover;
  background-position: center;
}
.list-product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
  display: flex;
  gap: 0.24rem;
}
.list-product-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.list-product-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
}
.list-product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-top: 0.04rem;
  margin-bottom: 0.08rem;
}
.list-product-meta {
  font-size: 0.24rem;
  color: #50607A;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.16rem;
}
.list-product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.04rem;
}
.list-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.list-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.list-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.list-price .original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
}

/* ===== Bigcard ===== */
.bigcard { padding: 0.24rem; }
.bigcard-header {
  display: flex;
  align-items: center;
  gap: 0.08rem;
  margin-bottom: 0.16rem;
}
.bigcard-header span { font-size: 0.28rem; color: #50607A; }
.bigcard-header svg { width: 0.28rem; height: 0.28rem; }
.bigcard-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.bigcard-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.46rem;
  margin-bottom: 0.24rem;
}
.product-cards-scroll {
  display: flex;
  gap: 0.16rem;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -0.24rem;
  padding: 0 0.24rem;
}
.product-cards-scroll::-webkit-scrollbar { display: none; }
.product-card {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.24rem;
  margin-bottom: 0.16rem;
  width: 5.92rem;
  flex-shrink: 0;
}
.product-image-wrap {
  position: relative;
  margin-bottom: 0.12rem;
}
.product-image-overlay {
  position: absolute;
  bottom: 0.16rem;
  left: 0.16rem;
  background: rgba(14, 17, 25, 0.5);
  border-radius: 0.08rem;
  padding: 0.06rem 0.12rem;
  font-size: 0.22rem;
  color: #FFFFFF;
}
.shop-header {
  display: flex;
  flex-direction: column;
  gap: 0.04rem;
  margin-bottom: 0.12rem;
}
.shop-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  white-space: nowrap;
}
.shop-meta {
  font-size: 0.26rem;
  color: #50607A;
  white-space: nowrap;
}
.product-image {
  width: 100%;
  height: 4.08rem;
  background-image: url(https://mastergo-default.oss-cn-hangzhou.aliyuncs.com/127231384010781/183107002341513/e4b133ee9ff9f04420d7c736fc131a86.webp);
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  margin-bottom: 0.12rem;
}
.product-name {
  font-size: 0.3rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
  margin-bottom: 0.03rem;
}
.product-tag {
  font-size: 0.24rem;
  color: #FF6200;
  margin-top: 0.08rem;
  margin-bottom: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.price-current {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.price-prefix {
  font-size: 0.26rem;
  font-weight: 500;
  color: #FF6200;
  margin-bottom: 0.04rem;
  transform: translateY(2px);
}
.price-unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.price-value {
  font-size: 0.4rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
  line-height: 0.42rem;
}
.price-original {
  font-size: 0.28rem;
  color: #7C889C;
  text-decoration: line-through;
  margin-left: 0.08rem;
  transform: translateY(2px);
}
.select-btn {
  width: 100%;
  height: 0.8rem;
  background: #FF6200;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 0.3rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  margin-top: 0.12rem;
}
.bigcard-footer {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-top: 0.16rem;
}
.action-bar {
  display: flex;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.action-btn {
  width: 0.6rem;
  height: 0.6rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  cursor: pointer;
}
.suggestion-chips {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
  margin-top: 0.16rem;
}
.suggestion-chip {
  display: flex;
  align-items: center;
  gap: 0.12rem;
  padding: 0.16rem 0.24rem;
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  font-size: 0.28rem;
  color: #50607A;
  cursor: pointer;
}
.suggestion-chip svg { width: 0.24rem; height: 0.24rem; }

/* ===== Order Card ===== */
.order-card { padding: 0.24rem; }
.order-title {
  font-size: 0.32rem;
  font-weight: 500;
  color: #11192D;
  margin-bottom: 0.08rem;
}
.order-desc {
  font-size: 0.28rem;
  color: #11192D;
  line-height: 0.5rem;
  margin-bottom: 0.16rem;
}
.order-summary {
  border: 0.01rem solid #DADEE2;
  border-radius: 0.12rem;
  padding: 0.16rem 0.24rem;
  margin-bottom: 0.16rem;
}
.order-shop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.08rem 0;
}
.order-shop-name {
  font-size: 0.28rem;
  color: #11192D;
}
.order-shop-meta { font-size: 0.26rem; color: #50607A; }
.order-item {
  display: flex;
  gap: 0.24rem;
  padding: 0.16rem 0;
}
.order-item-img {
  width: 2.14rem;
  height: 2.14rem;
  background-size: cover;
  background-position: center;
  border-radius: 0.12rem;
  flex-shrink: 0;
}
.order-item-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.order-item-name {
  font-size: 0.28rem;
  font-weight: 500;
  color: #11192D;
  line-height: 0.45rem;
}
.order-item-tag {
  display: inline-flex;
  padding: 0.08rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  font-size: 0.24rem;
  color: #50607A;
  width: fit-content;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.order-item-price {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.order-price {
  display: flex;
  align-items: flex-end;
  gap: 0.04rem;
}
.order-price .unit {
  font-size: 0.3rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-price .val {
  font-size: 0.36rem;
  font-weight: 700;
  color: #FF6200;
  font-family: "Alibaba Sans 102", sans-serif;
}
.order-qty {
  width: 0.48rem;
  height: 0.48rem;
  background: #F3F6F8;
  border-radius: 0.08rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.28rem;
  color: #11192D;
}
.order-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.2rem 0;
  border-top: 0.01rem solid #F3F6F8;
}
.order-row-label {
  font-size: 0.26rem;
  color: #11192D;
}
.order-row-value {
  font-size: 0.26rem;
  color: #11192D;
  display: flex;
  align-items: center;
  gap: 0.04rem;
}
.order-row-value.muted { color: #7C889C; }
.order-divider {
  height: 0.01rem;
  background: #11192D;

// ===== Product Catalog =====
const LISTCARD_PRODUCTS = [
  { img: FLOWER_IMAGES.flower1, name: '一人快手健康餐·鸡胸西兰花套餐', meta: '15分钟出锅 · 低脂 · 一人份', tag: '减脂打工人首选搭配好食材', price: '29.8', original: '58.5' },

  { img: FLOWER_IMAGES.flower6, name: '团圆年夜饭食材礼盒·8人豪华装', meta: '节日大餐 · 8-10人份 · 山珍海味', tag: '澳龙鲍鱼齐备团圆桌面有面子', price: '388.0', original: '588.0' },

const BIGCARD_PRODUCTS = {

};

// ===== Dynamic Content Engine =====
const DynamicContent = {
  // Random pick from array
  pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  },

  // Build input context
  getInput() {
    return {
      query: state.query || '',
      recipient: state.recipient || '',
      occasion: this.detectOccasion(state.query),
      season: this.detectSeason(),
      category: this.detectCategory(state.query),
    };
  },

  detectOccasion(q) {
    if (/年夜饭|团圆|过年|春节|除夕/.test(q)) return '团圆饭';
    if (/聚餐|宴请|招待|宾客|朋友来/.test(q)) return '宴请';
    if (/减脂|健身|增肌|轻食|低卡/.test(q)) return '健身';
    if (/宝宝|孩子|儿童|小孩/.test(q)) return '儿童营养';
    if (/火锅|涮锅/.test(q)) return '火锅';
    if (/快手|简单|省事|工作日|加班/.test(q)) return '快手餐';
    return '';
  },

  detectSeason() {
    const month = new Date().getMonth() + 1;
    if (month >= 3 && month <= 5) return '春季';
    if (month >= 6 && month <= 8) return '夏季';
    if (month >= 9 && month <= 11) return '秋季';
    return '冬季';
  },

  detectCategory(q) {
    const map = { '牛肉':'牛肉','猪肉':'猪肉','鸡肉':'鸡肉','排骨':'排骨','鱼':'鱼','虾':'虾','蔬菜':'时蔬','西兰花':'时蔬','西红柿':'时蔬','番茄':'时蔬','青菜':'时蔬','土豆':'根茎','胡萝卜':'根茎','豆腐':'豆制品','鸡蛋':'蛋类','三文鱼':'海鲜','澳龙':'海鲜','牛腩':'牛肉' };
    for (const k in map) if (q.includes(k)) return map[k];
    return '';
  },

  // ===== Thinking Generation =====
  async generateThinking() {
    const input = this.getInput();
    const r = input.recipient;
    const o = input.occasion;
    const c = input.category;
    const s = input.season;

    // Try LLM first
    if (LLM_CONFIG.apiKey) {
      const systemPrompt = '你是一个买菜助手，像懂行的家庭大厨一样亲切、专业地帮用户挑食材。请根据用户信息生成3段思考文案，每段50-80字，口语化。';
      const userPrompt = `搜索query: ${input.query}, 用餐场景: ${input.recipient}, 食材偏好: ${input.category}, 季节: ${input.season}, 场合: ${input.occasion}\n要求以JSON返回: {\"step1\":\"分析用户需求...\", \"step2\":\"买手团经验...\", \"step3\":\"挑选平台商品...\"}`;
      try {
        const text = await this.callLLM(systemPrompt, userPrompt);
        if (text) {
          const jsonMatch = text.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.step1 && parsed.step2 && parsed.step3) {
              return { step1: parsed.step1, step2: parsed.step2, step3: parsed.step3 };
            }
          }
        }
      } catch (e) {
        console.error('LLM thinking parse failed:', e);
      }
    }

    // Fallback template engine
    // Step 1: 分析用户需求
    const step1Parts = [];
    if (r.includes('家庭') || r.includes('三餐')) {

  // ===== Listcard Sections Generation =====
  async generateListcardSections() {
    const input = this.getInput();
    const r = input.recipient;
    const o = input.occasion;
    const c = input.category;
    const s = input.season;

    // Try LLM first
    if (LLM_CONFIG.apiKey) {
      const systemPrompt = '你是一个买菜助手，像懂行的家庭大厨一样亲切、专业地帮用户挑食材。请生成2-3个食材推荐板块的标题和描述，每个板块包含icon（emoji）、title（标题）、desc（描述，80-120字，口语化）。';
      const userPrompt = `搜索query: ${input.query}, 用餐场景: ${input.recipient}, 食材偏好: ${input.category}, 季节: ${input.season}, 场合: ${input.occasion}\n要求以JSON数组返回，例如: [{\"icon\":\"🔥\",\"title\":\"小红书爆款\",\"desc\":\"...\"},{\"icon\":\"📈\",\"title\":\"时令新品\",\"desc\":\"...\"}]`;
      try {
        const text = await this.callLLM(systemPrompt, userPrompt);
        if (text) {
          const jsonMatch = text.match(/\[[\s\S]*\]/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].icon && parsed[0].title && parsed[0].desc) {
              return parsed.slice(0, 3);
            }
          }
        }
      } catch (e) {
        console.error('LLM listcard parse failed:', e);
      }
    }

    // Fallback template engine
    const sections = [];

    // Pool of available sections
    const pool = [
      {
        id: 'trending',
        icon: '🔥',
        title: '小红书爆款',
        desc: () => {
          if (r.includes('家庭') || r.includes('三餐')) return '小红书上家庭三餐话题非常火，"一周菜谱"博主推荐的荤素均衡套餐很受欢迎。我筛了几款近期讨论度高的家庭组合，照着买不踩坑~';
          if (r.includes('一人') || r.includes('快手')) return '小红书"独居快手餐"话题热度持续，预处理食材+一锅出的吃法最火。这几款一人份套餐都是博主同款，照做不会翻车~';
          if (r.includes('火锅')) return '小红书火锅食材笔记里点赞最高的几款套餐，肉鲜虾活蘸料齐全。在家吃火锅氛围感拉满，朋友聚会必备~';
          if (r.includes('减脂') || r.includes('健身')) return '小红书健身博主同款减脂餐组合，热量蛋白都标得清清楚楚。这几款销量高、复购多，跟着吃就完事~';
          return '小红书上当季食材话题热度高，博主们都在晒新鲜直送的菜篮子。我为你精选了几款近期口碑好的组合~';
        },
      },
      {
        id: 'seasonal',
        icon: '📈',
        title: '时令新品',
        desc: () => {
          if (s === '春季') return '春天正是春笋、香椿、韭菜上市的季节，鲜嫩程度无可替代。我为你挑选了几款春季限定食材组合，错过等一年~';
          if (s === '夏季') return '夏季苦瓜、丝瓜、冬瓜清热消暑，做汤煮粥都很合适。我筛选了几款夏日清爽食材组合，开胃又解暑~';
          if (s === '秋季') return '秋季是莲藕、山药、板栗、南瓜的盛产季，滋补又养胃。我为你推荐这几款秋季养生食材组合~';
          return '冬季白萝卜、白菜、羊肉、牛肉正是好时候，暖身又营养。这几款冬日滋补组合很适合一家老小~';
        },
      },
      {
        id: 'value',
        icon: '💰',
        title: '性价比之选',
        desc: () => {
          if (r.includes('家庭')) return '家庭三餐想省钱但不能委屈胃，这几款套餐性价比超高。一份解决一日三餐，平均下来一顿才几块钱~';
          return '这几款食材组合价格亲民但分量足、品质不打折，适合预算有限但又想吃得健康的你~';
        },
      },
      {
        id: 'express',
        icon: '⚡',
        title: '附近30分钟达',
        desc: () => '附近这几家店铺支持 30 分钟极速达，鲜切肉、活鲜、洗好的蔬菜都是现拣现送。临时想吃就下单，保鲜冷链直送到家~',
      },
      {
        id: 'category',
        icon: c === '牛肉' || c === '牛腩' ? '🥩' : c === '海鲜' ? '🦐' : c === '时蔬' ? '🥬' : '🍱',
        title: c ? `${c}精选` : '主厨推荐',
        desc: () => {
          if (c === '牛肉' || c === '牛腩') return '牛肉专区精选了澳洲、安格斯、内蒙等优质产地，纹理清晰、嫩度可控。从牛排到牛腩都有，做啥菜都能搭~';
          if (c === '海鲜') return '海鲜专区精选活鲜直送，虾蟹贝类品质有保障。冷链运输保鲜度满分，到家依然鲜活~';
          if (c === '时蔬') return '当季时蔬专区，叶子挺、根茎实，产地直采当天到货。营养价值最高、性价比也最佳~';
          return '主厨精选当季优质食材，从主菜到配菜搭配齐全。免去你单点烦恼，照着买就有完整一桌~';
        },
      },
    ];

    // Select relevant sections
    sections.push(pool[0]); // 小红书爆款 always first
    sections.push(pool[1]); // 时令新品 always second

    if (o === '团圆饭' || o === '宴请') sections.push(pool[3]); // 附近 30 分钟达
    if (c) sections.push(pool[4]); // category section if category specified
    else if (!r.includes('招待') && !r.includes('宾客')) sections.push(pool[2]); // 性价比之选 for casual

    // Ensure unique emojis
    const usedEmojis = new Set();
    return sections.filter(sec => {
      if (usedEmojis.has(sec.icon)) return false;
      usedEmojis.add(sec.icon);
      return true;
    }).map(sec => ({
      icon: sec.icon,
      title: sec.title,
      desc: typeof sec.desc === 'function' ? sec.desc() : sec.desc,
    }));
  },

    try {
      const res = await fetch(LLM_CONFIG.endpoint, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${LLM_CONFIG.apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: LLM_CONFIG.model,
          input: {
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt },
            ],
          },
        }),
      });
      const data = await res.json();
      return data.output?.text || data.output?.choices?.[0]?.message?.content || null;

const homeView = document.getElementById('home-view');
const assistantView = document.getElementById('assistant-view');
const chatArea = document.getElementById('chatArea');
const messagesEl = document.getElementById('messages');

function createRow(className, innerHTML) {
  const row = document.createElement('div');
  row.className = 'message-row ' + className;
  row.innerHTML = innerHTML;
  messagesEl.appendChild(row);
  requestAnimationFrame(() => {
    row.scrollIntoView({ block: 'start', behavior: 'auto' });
  });
  return row;
}

function addUserBubble(text) {
  createRow('user', `<div class="user-bubble">${escapeHtml(text)}</div>`);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

          </div>
          <div class="thinking-step-desc">${thinking.step3}</div>
        </div>
      </div>
    </div>
  `;
  createRow('assistant', html);

  const allGroups = document.querySelectorAll('.thinking-step-group');
  const g1 = allGroups[allGroups.length - 3];
  const g2 = allGroups[allGroups.length - 2];
  const g3 = allGroups[allGroups.length - 1];

  // Dynamic height: measure tallest step group
  const container = g1.parentElement;
  let maxH = 0;
  [g1, g2, g3].forEach(g => {
    const h = g.getBoundingClientRect().height;
    if (h > maxH) maxH = h;
  });
  if (maxH > 0 && container) {

  setTimeout(() => { g1.classList.add('visible'); g1.scrollIntoView({ block: 'start', behavior: 'auto' }); }, 200);

  setTimeout(() => {

      (async () => { await showBigcard(); })();
    } else {
      (async () => { await showListcard(); })();
    }
  }, 4000);
}

// ===== Query Classification =====
function isVagueQuery(text) {
  const t = text.trim();
  // 只要有场景信息就不算模糊query
  if (/一人|快手|家庭|三餐|招待|宾客|减脂|健身|火锅|宝宝|儿童|聚餐|年夜饭|团圆/.test(t)) return false;
  // 只要有品类信息就不算模糊query
  if (/牛肉|猪肉|鸡肉|排骨|牛腩|鱼|虾|海鲜|蔬菜|时蔬|西兰花|番茄|西红柿|青菜|土豆|胡萝卜|豆腐|鸡蛋|三文鱼|澳龙/.test(t)) return false;
  // 只有包含核心模糊意图词才算模糊
  return /买菜|蔬菜|生鲜|食材|做饭|配菜|炒菜/.test(t);
}

function isCategoryQuery(text) {
  return /(牛肉|猪肉|鸡肉|排骨|牛腩|鱼|虾|海鲜|时蔬|西兰花|番茄|西红柿|土豆|胡萝卜|豆腐|鸡蛋|三文鱼|澳龙)/.test(text.trim());
}

// ===== Interaction Handlers =====
function isScenarioQuery(text) {
  return /一人|快手|家庭|三餐|招待|宾客|减脂|健身|火锅|宝宝|儿童|聚餐|年夜饭|团圆/.test(text);
}

function routeQuery(text) {
  state.query = text;
  if (text.includes('备注')) {
    showOrderCard();
  } else if (!state.addressShown) {
    state.pendingQuery = text;
    showAddressCard();
  } else {
    if (isVagueQuery(text)) {
      showClarifyCard();
    } else if (isCategoryQuery(text) || isScenarioQuery(text)) {
      (async () => { await showThinkingCard(); })();
    } else {
      (async () => { await showThinkingCard(); })();
    }
  }
}

function selectScenario(text) {
  state.recipient = text;
  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}

function hideAllChips() {
  document.querySelectorAll('.suggestion-chips').forEach(el => {
    el.style.display = 'none';
  });
}

function updateBlessingDisplay(blessing) {
  const orderEl = document.getElementById('order-note');
  if (orderEl) {
    orderEl.textContent = blessing;
    orderEl.classList.remove('muted');
  }
  const detailEl = document.getElementById('detail-note');
  if (detailEl) {
    detailEl.textContent = blessing;
    detailEl.classList.remove('muted');
  }
}

function sendQuick(text) {
  const isChip = typeof event !== 'undefined' && event && event.target && event.target.closest('.suggestion-chip');

  if (isChip) {
    hideAllChips();

    if (text.includes('加个备注')) {
      const blessing = text.replace('加个备注，', '').replace(/[""]/g, '').trim();
      state.blessing = blessing;
      const chip = event.target.closest('.suggestion-chip');
      const orderCard = chip && chip.closest('.order-card');
      if (orderCard) {
        const blessingEl = orderCard.querySelector('#order-note');
        if (blessingEl) {
          blessingEl.textContent = blessing;
          blessingEl.classList.remove('muted');
        }
      } else {
        updateBlessingDisplay(blessing);
      }
      return;
    }
  }

  addUserBubble(text);
  setTimeout(() => {
    routeQuery(text);
  }, 300);
}
